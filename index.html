<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>🗓️ 环球旅行日历 · 可编辑版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a1628; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; color: #e5efff; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid #1e3a5a; padding-bottom: 16px; margin-bottom: 16px; }
        .header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 2px; }
        .header h1 small { font-size: 1rem; opacity: 0.5; font-weight: 300; margin-left: 12px; }
        .header .stats { display: flex; gap: 16px; font-size: 0.85rem; flex-wrap: wrap; }
        .header .stats span { background: #142b44; padding: 4px 16px; border-radius: 30px; opacity: 0.8; }

        /* ===== 搜索框 ===== */
        .search-section { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .search-box { flex: 1; min-width: 200px; position: relative; display: flex; align-items: center; background: #0f1f33; border: 1px solid #1a3450; border-radius: 40px; padding: 0 16px; transition: all 0.3s; }
        .search-box:focus-within { border-color: #f9d77e; box-shadow: 0 0 20px #f9d77e15; }
        .search-box i { color: #5a7a9a; font-size: 16px; margin-right: 10px; }
        .search-box input { flex: 1; padding: 10px 0; border: none; background: transparent; color: #e5efff; font-size: 0.95rem; font-family: inherit; outline: none; }
        .search-box input::placeholder { color: #4a6a8a; }
        .search-box .clear-btn { background: none; border: none; color: #4a6a8a; cursor: pointer; font-size: 18px; padding: 4px 8px; display: none; transition: color 0.2s; }
        .search-box .clear-btn:hover { color: #f9d77e; }
        .search-box .clear-btn.visible { display: block; }
        .search-stats { font-size: 0.85rem; color: #6a8aaa; white-space: nowrap; }
        .search-stats strong { color: #f9d77e; }

        .highlight { background: #f9d77e30; color: #f9d77e; padding: 0 2px; border-radius: 4px; }

        /* ===== 日历 ===== */
        .calendar-wrapper { margin-bottom: 28px; }
        .month-nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 12px 4px; border-bottom: 1px solid #1a3450; margin-bottom: 12px; }
        .month-nav .month-title { font-size: 1.3rem; font-weight: 400; color: #f9d77e; letter-spacing: 2px; }
        .month-nav .month-title span { opacity: 0.5; font-weight: 300; font-size: 0.9rem; margin-left: 8px; }
        .month-nav button { background: #142b44; border: 1px solid #1a3450; color: #e5efff; padding: 4px 18px; border-radius: 30px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .month-nav button:hover { background: #1a3450; border-color: #f9d77e55; }
        .month-nav .today-btn-sm { background: #4caf50; color: #fff; font-weight: 500; font-size: 0.8rem; padding: 4px 14px; }
        .month-nav .today-btn-sm:hover { background: #66bb6a; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-grid .weekday { text-align: center; font-size: 0.8rem; opacity: 0.5; padding: 4px 0; font-weight: 500; letter-spacing: 1px; }
        .day-cell { background: #0f1f33; border: 1px solid #1a3450; border-radius: 10px; padding: 6px 4px; min-height: 64px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative; }
        .day-cell:hover { background: #1a3450; border-color: #f9d77e55; transform: scale(1.02); z-index: 2; }
        .day-cell .date { font-size: 0.7rem; opacity: 0.6; font-weight: 300; }
        .day-cell .day-label { font-size: 0.75rem; font-weight: 600; color: #f9d77e; margin-top: 1px; }
        .day-cell .city { font-size: 0.6rem; opacity: 0.7; text-align: center; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
        .day-cell .flag { font-size: 0.6rem; opacity: 0.5; margin-top: 2px; }
        .day-cell .dot { width: 6px; height: 6px; border-radius: 50%; background: #f9d77e; margin-top: 3px; opacity: 0.6; }
        .day-cell .reminder-dot { background: #e67e22; opacity: 0.9; animation: pulse 1.5s ease-in-out infinite; }
        .day-cell .today-dot { background: #4caf50; opacity: 1; }
        .day-cell .edit-dot { background: #4a9eff; opacity: 1; }
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(0.9); } }
        .day-cell.empty { opacity: 0.15; cursor: default; pointer-events: none; }
        .day-cell.empty:hover { transform: none; background: #0f1f33; border-color: #1a3450; }
        .day-cell.today { border-color: #4caf50; background: #1a2a40; box-shadow: 0 0 20px #4caf5022; }
        .day-cell.selected { border-color: #f9d77e; background: #1a2a40; box-shadow: 0 0 20px #f9d77e33; }
        .day-cell.no-data { opacity: 0.3; cursor: default; }
        .day-cell.no-data:hover { transform: none; background: #0f1f33; border-color: #1a3450; }

        .nav-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .nav-row button { background: #142b44; border: 1px solid #1a3450; color: #e5efff; padding: 6px 18px; border-radius: 40px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .nav-row button:hover { background: #1a3450; border-color: #f9d77e55; }
        .nav-row .jump-input { background: #0f1f33; border: 1px solid #1a3450; color: #e5efff; padding: 6px 12px; border-radius: 40px; width: 70px; text-align: center; font-size: 0.9rem; }
        .nav-row .jump-input:focus { outline: none; border-color: #f9d77e; }
        .nav-row .today-btn { background: #4caf50; color: #fff; font-weight: 600; }
        .nav-row .today-btn:hover { background: #66bb6a; }
        .nav-row .show-all-btn { background: #1a3450; border-color: #f9d77e44; }
        .nav-row .show-all-btn:hover { background: #2a4a6a; }

        .day-list { margin-top: 10px; }

        /* ===== 国家提示卡（含货币换算器） ===== */
        .country-tip {
            background: #0d2640;
            border-left: 5px solid #f9d77e;
            border-radius: 14px;
            padding: 14px 20px;
            margin: 8px 0 16px 0;
            box-shadow: 0 0 0 1px #1a3a5a;
            transition: all 0.2s;
        }
        .country-tip .tip-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .country-tip .tip-header .name { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .country-tip .tip-header .currency { background: #1a3450; padding: 2px 14px; border-radius: 30px; font-size: 0.8rem; }
        .country-tip .tip-body { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.85rem; opacity: 0.85; }
        .country-tip .tip-body .apps span { background: #142b44; padding: 1px 10px; border-radius: 30px; margin-right: 4px; }
        .country-tip .tip-body .note { opacity: 0.7; font-size: 0.82rem; width: 100%; border-top: 1px dashed #1a3a5a; padding-top: 6px; margin-top: 4px; }

        .currency-converter {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1a3450;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            font-size: 0.85rem;
        }
        .currency-converter .rate-display {
            color: #f9d77e;
            font-weight: 500;
            font-size: 0.9rem;
            background: #0f1f33;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #1a3450;
        }
        .currency-converter .converter-input {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f1f33;
            padding: 2px 12px 2px 16px;
            border-radius: 30px;
            border: 1px solid #1a3450;
        }
        .currency-converter .converter-input input {
            background: transparent;
            border: none;
            color: #e5efff;
            font-size: 0.85rem;
            width: 80px;
            padding: 4px 0;
            font-family: inherit;
            outline: none;
        }
        .currency-converter .converter-input input:focus { border-color: #f9d77e; }
        .currency-converter .converter-input .currency-label { color: #6a8aaa; font-size: 0.75rem; }
        .currency-converter .converter-result {
            color: #8ab4d6;
            font-size: 0.85rem;
            min-width: 70px;
        }
        .currency-converter .swap-btn {
            background: transparent;
            border: 1px solid #1a3450;
            color: #6a8aaa;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .currency-converter .swap-btn:hover {
            background: #1a3450;
            color: #f9d77e;
            border-color: #f9d77e55;
        }
        .currency-converter .loading-rate {
            color: #6a8aaa;
            font-size: 0.8rem;
            animation: pulse-text 1.5s ease-in-out infinite;
        }
        @keyframes pulse-text { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* ===== 每日行程卡片 ===== */
        .day-entry { background: #0f1f33; border: 1px solid #1a3450; border-radius: 14px; padding: 14px 18px; margin-bottom: 8px; cursor: pointer; transition: all 0.3s; }
        .day-entry:hover { background: #142b44; border-color: #2a4a6a; }
        .day-entry .day-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
        .day-entry .day-head .day-label { font-weight: 600; color: #f9d77e; font-size: 1.0rem; }
        .day-entry .day-head .city { font-weight: 400; background: #142b44; padding: 0 14px; border-radius: 30px; font-size: 0.9rem; }
        .day-entry .day-head .country { font-size: 0.75rem; opacity: 0.5; }
        .day-entry .sights { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 6px 0 4px 0; }
        .day-entry .sights span { background: #1a3450; padding: 1px 12px; border-radius: 30px; font-size: 0.82rem; }
        .day-entry .info-row { display: flex; flex-wrap: wrap; gap: 12px 24px; font-size: 0.8rem; opacity: 0.75; margin-top: 4px; }
        .day-entry .info-row .label { opacity: 0.5; }
        .day-entry .reminder-box { background: #f9d77e15; border-left: 4px solid #f9d77e; padding: 8px 14px; margin-top: 8px; border-radius: 8px; color: #f9d77e; font-size: 0.9rem; }
        .day-entry .editable-fields { margin-top: 10px; border-top: 1px dashed #1a3450; padding-top: 10px; display: none; flex-direction: column; gap: 10px; }
        .day-entry .editable-fields.open { display: flex; }
        .day-entry .editable-fields .field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
        .day-entry .editable-fields .field-row label { font-size: 0.78rem; color: #8ab4d6; min-width: 70px; }
        .day-entry .editable-fields .field-row input, .day-entry .editable-fields .field-row textarea { background: #0f1f33; border: 1px solid #1a3450; border-radius: 8px; padding: 6px 12px; color: #e5efff; font-size: 0.85rem; flex: 1; min-width: 120px; font-family: inherit; }
        .day-entry .editable-fields .field-row input:focus, .day-entry .editable-fields .field-row textarea:focus { outline: none; border-color: #f9d77e; }
        .day-entry .editable-fields .field-row textarea { min-height: 44px; resize: vertical; }
        .day-entry .editable-fields .field-row .img-upload-btn { background: #1a3450; border: 1px dashed #3a6a8a; border-radius: 30px; padding: 4px 14px; font-size: 0.78rem; color: #8ab4d6; cursor: pointer; transition: 0.2s; }
        .day-entry .editable-fields .field-row .img-upload-btn:hover { background: #1a4a6a; border-color: #f9d77e55; color: #f9d77e; }
        .day-entry .editable-fields .field-row .img-upload-btn input { display: none; }
        .day-entry .editable-fields .field-actions { display: flex; gap: 10px; margin-top: 6px; }
        .day-entry .editable-fields .field-actions button { padding: 6px 22px; border-radius: 30px; font-size: 0.82rem; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .day-entry .editable-fields .field-actions .save-btn { background: #f9d77e; color: #0a1628; }
        .day-entry .editable-fields .field-actions .save-btn:hover { background: #ffe28a; transform: scale(1.02); }
        .day-entry .editable-fields .field-actions .cancel-btn { background: #1a3450; color: #8ab4d6; }
        .day-entry .editable-fields .field-actions .cancel-btn:hover { background: #2a4a6a; }
        .day-entry .edit-toggle { background: transparent; border: none; color: #4a9eff; font-size: 0.85rem; cursor: pointer; padding: 2px 10px; border-radius: 30px; transition: 0.2s; font-family: inherit; }
        .day-entry .edit-toggle:hover { background: #142b44; color: #7ab8ff; }
        .day-entry .image-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .day-entry .image-gallery img { max-width: 80px; max-height: 60px; border-radius: 6px; object-fit: cover; border: 1px solid #1a3450; cursor: pointer; transition: 0.2s; }
        .day-entry .image-gallery img:hover { transform: scale(1.05); border-color: #f9d77e55; }
        .day-entry.collapsed .sights, .day-entry.collapsed .info-row, .day-entry.collapsed .reminder-box,
        .day-entry.collapsed .editable-fields, .day-entry.collapsed .image-gallery { display: none; }
        .day-entry.collapsed { opacity: 0.6; padding: 10px 18px; }
        .day-entry.collapsed:hover { opacity: 0.9; }
        .day-entry.collapsed .edit-toggle { display: none; }

        .book-summary { background: #0d1f30; border-radius: 14px; padding: 14px 18px; margin-top: 16px; border: 1px solid #1a3450; }
        .book-summary .item { display: flex; align-items: baseline; gap: 8px; font-size: 0.9rem; padding: 4px 0; border-bottom: 1px solid #1a3450; flex-wrap: wrap; cursor: pointer; transition: 0.2s; }
        .book-summary .item:hover { opacity: 0.8; }
        .book-summary .item:last-child { border-bottom: none; }
        .book-summary .item .label { color: #f9d77e; font-weight: 500; }
        .book-summary .item .detail { opacity: 0.8; font-size: 0.85rem; }
        .book-summary .item .date-tag { background: #e67e22; color: #fff; font-size: 0.65rem; padding: 1px 10px; border-radius: 30px; font-weight: 600; }

        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,22,40,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 20px; }
        .loading-overlay.active { display: flex; }
        .loading-overlay .spinner { width: 48px; height: 48px; border: 4px solid #1a3450; border-top-color: #f9d77e; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay .text { font-size: 1.1rem; opacity: 0.7; }

        @media (max-width: 700px) { .calendar-grid { gap: 4px; } .day-cell { min-height: 50px; padding: 4px 2px; } .day-cell .city { font-size: 0.55rem; } .day-cell .day-label { font-size: 0.65rem; } .day-entry { padding: 10px 14px; } .header h1 { font-size: 1.4rem; } .month-nav .month-title { font-size: 1.1rem; } .month-nav button { font-size: 0.85rem; padding: 3px 12px; } .day-entry .editable-fields .field-row { flex-direction: column; align-items: stretch; } .search-section { flex-direction: column; align-items: stretch; } .currency-converter { flex-direction: column; align-items: stretch; } .currency-converter .converter-input { width: 100%; } .currency-converter .converter-input input { width: 100%; } }
        @media (max-width: 480px) { .calendar-grid { gap: 3px; } .day-cell { min-height: 44px; border-radius: 6px; } .day-cell .date { font-size: 0.55rem; } .day-cell .day-label { font-size: 0.55rem; } .day-cell .city { display: none; } .day-cell .flag { display: none; } }
        ::-webkit-scrollbar { width: 6px; background: #0a1628; } ::-webkit-scrollbar-thumb { background: #1a3450; border-radius: 10px; }
    </style>
</head>

</div>

        '希腊': { code: 'EUR', symbol: '€', name: '欧元' },
        '埃及': { code: 'EGP', symbol: '£', name: '埃及镑' }
    };

    // 获取所有需要查询的货币代码（去重）
    const allCurrencyCodes = [...new Set(Object.values(countryCurrencyMap).map(c => c.code))];
    const baseCurrency = 'CNY';

    let exchangeRates = null;
    let ratesLastUpdated = null;
    let ratesLoading = false;

    // ================================================================
    //  💱 获取实时汇率（Frankfurter API，缓存1小时）
    // ================================================================
    async function fetchExchangeRates() {
        // 如果缓存有效（1小时内），直接返回缓存
        if (exchangeRates && ratesLastUpdated && (Date.now() - ratesLastUpdated < 60 * 60 * 1000)) {
            return exchangeRates;
        }

        if (ratesLoading) {
            // 等待已有请求完成
            await new Promise(resolve => {
                const check = () => {
                    if (!ratesLoading) resolve();
                    else setTimeout(check, 200);
                };
                check();
            });
            return exchangeRates;
        }

        ratesLoading = true;
        try {
            const symbols = allCurrencyCodes.filter(c => c !== baseCurrency).join(',');
            const url = `https://api.frankfurter.app/latest?from=${baseCurrency}&to=${symbols}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            exchangeRates = data.rates;
            ratesLastUpdated = Date.now();
            console.log('💱 汇率已更新:', exchangeRates);
            return exchangeRates;
        } catch (err) {
            console.warn('获取实时汇率失败，使用备用汇率', err);
            // 备用汇率（基于你攻略中的汇率）
            exchangeRates = {
                'KZT': 140, 'UZS': 1840, 'AZN': 0.238, 'GEL': 0.385,
                'AMD': 70, 'TRY': 4.76, 'BAM': 0.263, 'EUR': 0.128,
                'RSD': 15, 'EGP': 4.5, 'USD': 0.14
            };
            ratesLastUpdated = Date.now();
            return exchangeRates;
        } finally {
            ratesLoading = false;
        }
    }

    // ================================================================
    //  💱 汇率换算器组件（HTML生成）
    // ================================================================
    function generateCurrencyConverter(countryName) {
        const currencyInfo = countryCurrencyMap[countryName];
        if (!currencyInfo || currencyInfo.code === 'CNY') return '';
        const code = currencyInfo.code;
        const symbol = currencyInfo.symbol;
        const name = currencyInfo.name;

        return `
            <div class="currency-converter" data-country="${countryName}" data-currency="${code}">
                <span class="rate-display" id="rate_${countryName.replace(/\s/g,'_')}">🔄 加载汇率中...</span>
                <div class="converter-input">
                    <input type="number" placeholder="金额" class="conv-input" data-country="${countryName}" id="input_cny_${countryName.replace(/\s/g,'_')}" />
                    <span class="currency-label">¥</span>
                </div>
                <span>≈</span>
                <div class="converter-input">
                    <span class="currency-label">${symbol}</span>
                    <input type="number" placeholder="金额" class="conv-output" data-country="${countryName}" id="output_local_${countryName.replace(/\s/g,'_')}" readonly style="width:80px;background:transparent;border:none;color:#f9d77e;font-weight:500;outline:none;font-family:inherit;" />
                </div>
                <button class="swap-btn" onclick="swapConverter('${countryName}')" title="互换方向">⇄</button>
                <span style="font-size:0.7rem;opacity:0.4;">${name}</span>
            </div>
        `;
    }

    // ================================================================
    //  💱 汇率换算器交互逻辑
    // ================================================================
    let converterDirection = {}; // 记录每个国家的换算方向: 'cny2local' 或 'local2cny'

    function setupConverter(countryName) {
        const key = countryName.replace(/\s/g, '_');
        const inputCny = document.getElementById(`input_cny_${key}`);
        const outputLocal = document.getElementById(`output_local_${key}`);
        if (!inputCny || !outputLocal) return;

        const currencyInfo = countryCurrencyMap[countryName];
        if (!currencyInfo) return;
        const code = currencyInfo.code;

        // 初始化方向
        if (!converterDirection[countryName]) {
            converterDirection[countryName] = 'cny2local';
        }

        // 获取当前汇率
        const rate = exchangeRates ? exchangeRates[code] : null;
        if (!rate) return;

        // 更新汇率显示
        const rateDisplay = document.getElementById(`rate_${key}`);
        if (rateDisplay) {
            rateDisplay.textContent = `1 ¥ = ${rate.toFixed(4)} ${code}`;
        }

        // 输入转换
        inputCny.addEventListener('input', function() {
            const val = parseFloat(this.value);
            if (!isNaN(val) && val > 0) {
                const result = val * rate;
                outputLocal.value = result.toFixed(2);
                converterDirection[countryName] = 'cny2local';
            } else {
                outputLocal.value = '';
            }
        });

        // 输出框点击反向换算（也可以输入）
        outputLocal.addEventListener('focus', function() {
            // 如果当前是 CNY→Local 模式，点击时自动切换到 Local→CNY
            if (converterDirection[countryName] === 'cny2local') {
                // 清空输入，让用户输入本地货币
                inputCny.value = '';
                this.value = '';
                converterDirection[countryName] = 'local2cny';
                this.placeholder = '输入金额';
                inputCny.placeholder = '换算结果';
                // 交换样式提示
                this.style.color = '#e5efff';
                inputCny.style.color = '#f9d77e';
                inputCny.readOnly = false;
                this.readOnly = false;
            }
        });

        outputLocal.addEventListener('input', function() {
            const val = parseFloat(this.value);
            if (!isNaN(val) && val > 0 && converterDirection[countryName] === 'local2cny') {
                const result = val / rate;
                inputCny.value = result.toFixed(2);
            } else if (converterDirection[countryName] === 'cny2local') {
                // 如果用户试图在输出框输入，切换到反向模式
                const val2 = parseFloat(this.value);
                if (!isNaN(val2) && val2 > 0) {
                    converterDirection[countryName] = 'local2cny';
                    inputCny.value = (val2 / rate).toFixed(2);
                }
            }
        });

        // 输入框点击恢复 CNY→Local 模式
        inputCny.addEventListener('focus', function() {
            if (converterDirection[countryName] === 'local2cny') {
                converterDirection[countryName] = 'cny2local';
                this.value = '';
                outputLocal.value = '';
                this.placeholder = '金额';
                outputLocal.placeholder = '换算结果';
                this.style.color = '#e5efff';
                outputLocal.style.color = '#f9d77e';
                this.readOnly = false;
                outputLocal.readOnly = true;
            }
        });

        // 设置初始占位
        inputCny.placeholder = '金额';
        outputLocal.placeholder = '换算结果';
        outputLocal.readOnly = true;
    }

    function swapConverter(countryName) {
        const key = countryName.replace(/\s/g, '_');
        const inputCny = document.getElementById(`input_cny_${key}`);
        const outputLocal = document.getElementById(`output_local_${key}`);
        if (!inputCny || !outputLocal) return;

        // 切换方向
        if (converterDirection[countryName] === 'cny2local') {
            converterDirection[countryName] = 'local2cny';
            inputCny.value = '';
            outputLocal.value = '';
            inputCny.placeholder = '换算结果';
            outputLocal.placeholder = '输入金额';
            inputCny.style.color = '#f9d77e';
            outputLocal.style.color = '#e5efff';
            inputCny.readOnly = true;
            outputLocal.readOnly = false;
            outputLocal.focus();
        } else {
            converterDirection[countryName] = 'cny2local';
            inputCny.value = '';
            outputLocal.value = '';
            inputCny.placeholder = '金额';
            outputLocal.placeholder = '换算结果';
            inputCny.style.color = '#e5efff';
            outputLocal.style.color = '#f9d77e';
            inputCny.readOnly = false;
            outputLocal.readOnly = true;
            inputCny.focus();
        }
    }

    function getTodayDay() {

        if (diff >= 0 && diff < TOTAL_DAYS) return diff + 1;
        return 1;
    }

        return new Date(year, month + 1, 0).getDate();

        const target = new Date(year, month, date);
        const diff = Math.floor((target - startDate) / (1000 * 60 * 60 * 24));
        if (diff >= 0 && diff < TOTAL_DAYS) return diff + 1;
        return null;
    }

    // ================================================================
    //  Supabase 操作
    // ================================================================
    async function loadFromSupabase() {
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.add('active');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*&order=day.asc`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (data.length > 0) {
                tripData = data;
            } else {
                await initDefaultData();
            }
        } catch (err) {
            console.warn('从 Supabase 加载失败，使用本地缓存', err);
            const cached = localStorage.getItem('tripData_cache');
            if (cached) {
                try { tripData = JSON.parse(cached); } catch(e) {}
            }
            if (!tripData || tripData.length === 0) {
                await initDefaultData();
            }
        }
        localStorage.setItem('tripData_cache', JSON.stringify(tripData));
        overlay.classList.remove('active');
        return tripData;
    }

    async function saveToSupabase(day, field, value) {
        const updateData = {
            [field]: value,
            updated_at: new Date().toISOString()
        };
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?day=eq.${day}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify(updateData)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const result = await res.json();
            const idx = tripData.findIndex(d => d.day === day);
            if (idx !== -1) {
                tripData[idx] = { ...tripData[idx], ...result[0] };
            }
            localStorage.setItem('tripData_cache', JSON.stringify(tripData));
            return true;
        } catch (err) {
            console.error('保存失败', err);
            const idx = tripData.findIndex(d => d.day === day);
            if (idx !== -1) {
                tripData[idx][field] = value;
                localStorage.setItem('tripData_cache', JSON.stringify(tripData));
            }
            return false;
        }
    }

    // ================================================================

    function uploadToCloudinary(file) {
        return new Promise((resolve, reject) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.secure_url) resolve(data.secure_url);
                else reject(new Error('Cloudinary 上传失败: ' + JSON.stringify(data)));
            })
            .catch(err => reject(err));
        });
    }

    // ================================================================

    // ================================================================
    function buildCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
        weekdays.forEach(d => {
            const el = document.createElement('div');
            el.className = 'weekday';
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(currentYear, currentMonth, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);

        const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
        let dayRange = '';
        const firstDayNum = getDayNumberForDate(currentYear, currentMonth, 1);
        const lastDayNum = getDayNumberForDate(currentYear, currentMonth, daysInMonth);
        if (firstDayNum !== null && lastDayNum !== null) {
            dayRange = `Day${firstDayNum}-${lastDayNum}`;
        } else if (firstDayNum !== null) {
            dayRange = `Day${firstDayNum}起`;
        } else if (lastDayNum !== null) {
            dayRange = `Day${lastDayNum}止`;
        }
        document.getElementById('monthTitle').innerHTML = `${currentYear}年${monthNames[currentMonth]} <span>${dayRange}</span>`;

        for (let i = 0; i < startOffset; i++) {
            const empty = document.createElement('div');
            empty.className = 'day-cell empty';
            grid.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';

            const dayNum = getDayNumberForDate(currentYear, currentMonth, d);
            const dateEl = document.createElement('div');
            dateEl.className = 'date';
            dateEl.textContent = `${currentMonth+1}/${d}`;
            cell.appendChild(dateEl);

            if (dayNum !== null && dayNum >= 1 && dayNum <= TOTAL_DAYS) {
                const data = getDayData(dayNum);
                if (data) {
                    const dayLabel = document.createElement('div');
                    dayLabel.className = 'day-label';
                    dayLabel.textContent = `Day${data.day}`;
                    cell.appendChild(dayLabel);

                    const cityEl = document.createElement('div');
                    cityEl.className = 'city';
                    const cityDisplay = data.city ? (data.city.length > 10 ? data.city.slice(0, 10) + '…' : data.city) : '待定';
                    cityEl.textContent = cityDisplay;
                    cell.appendChild(cityEl);

                    const flagEl = document.createElement('div');
                    flagEl.className = 'flag';
                    flagEl.textContent = countryMap[data.country] || '🌍';
                    cell.appendChild(flagEl);

                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    const hasEdit = data.hotel_name || data.daily_note || data.ticket_price || data.transport_note || data.image_urls;
                    if (hasEdit) dot.classList.add('edit-dot');
                    const todayDay = getTodayDay();
                    if (data.day === todayDay) dot.classList.add('today-dot');
                    cell.appendChild(dot);

                    if (data.day === selectedDay) cell.classList.add('selected');
                    if (data.day === todayDay) cell.classList.add('today');

                    cell.dataset.day = data.day;
                    cell.addEventListener('click', () => { jumpToDay(data.day); });
                }
            } else {
                cell.classList.add('no-data');
            }
            grid.appendChild(cell);
        }
    }

    // ================================================================

    // ================================================================
    function isDayMatchingSearch(data, query) {
        if (!query.trim()) return true;
        const q = query.trim().toLowerCase();
        const fields = [
            data.city || '',
            data.country || '',
            data.hotel_name || '',
            data.hotel_note || '',
            data.transport_note || '',
            data.ticket_price || '',
            data.daily_note || ''
        ];
        let sightsArr = [];
        try {
            sightsArr = typeof data.sights === 'string' ? JSON.parse(data.sights) : (data.sights || []);
        } catch(e) { sightsArr = []; }
        const sightsText = sightsArr.join(' ');
        fields.push(sightsText);

        return fields.some(f => f.toLowerCase().includes(q));
    }

    function highlightText(text, query) {
        if (!query.trim() || !text) return text;
        const q = query.trim();
        const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<span class="highlight">$1</span>');
    }

                lastCountry = data.country;
            }

            const entry = document.createElement('div');
            entry.className = 'day-entry';
            if (selectedDay === null && !searchQuery.trim()) {
                entry.classList.add('collapsed');
            }
            entry.dataset.day = data.day;

            let sightsArr = [];
            try {
                sightsArr = typeof data.sights === 'string' ? JSON.parse(data.sights) : (data.sights || []);
            } catch(e) { sightsArr = []; }

            let images = [];
            try {
                images = typeof data.image_urls === 'string' ? JSON.parse(data.image_urls) : (data.image_urls || []);
            } catch(e) { images = []; }

            let imageHtml = '';
            if (images.length > 0) {
                imageHtml = `<div class="image-gallery">${images.map(url => `<img src="${url}" alt="行程图片" onclick="window.open('${url}','_blank')" />`).join('')}</div>`;
            }

            const cityDisplay = searchQuery.trim() ? highlightText(data.city || '待定', searchQuery) : (data.city || '待定');
            const countryDisplay = searchQuery.trim() ? highlightText(data.country || '未知', searchQuery) : (data.country || '未知');
            const hotelDisplay = searchQuery.trim() ? highlightText(data.hotel_name || '未填', searchQuery) : (data.hotel_name || '未填');
            const transportDisplay = searchQuery.trim() ? highlightText(data.transport_note || '未填', searchQuery) : (data.transport_note || '未填');
            const ticketDisplay = data.ticket_price ? (searchQuery.trim() ? highlightText(data.ticket_price, searchQuery) : data.ticket_price) : '';
            const dailyNoteDisplay = data.daily_note ? (searchQuery.trim() ? highlightText(data.daily_note, searchQuery) : data.daily_note) : '';
            const hotelNoteDisplay = data.hotel_note ? (searchQuery.trim() ? highlightText(data.hotel_note, searchQuery) : data.hotel_note) : '';

            const sightsHtml = sightsArr.map(s => {
                const display = searchQuery.trim() ? highlightText(s, searchQuery) : s;
                return `<span>${display}</span>`;
            }).join('');

            entry.innerHTML = `
                <div class="day-head">
                    <span class="day-label">Day ${data.day}</span>
                    <span class="city">📍 ${cityDisplay}</span>
                    <span class="country">${countryDisplay} · ${data.date || ''}</span>
                    <button class="edit-toggle" onclick="toggleEdit(${data.day})">✏️ 编辑</button>
                </div>
                <div class="sights">${sightsHtml}</div>
                <div class="info-row">
                    <span><span class="label">🏨</span> ${hotelDisplay}</span>
                    <span><span class="label">🚌</span> ${transportDisplay}</span>
                    ${ticketDisplay ? `<span><span class="label">🎟️</span> ${ticketDisplay}</span>` : ''}
                </div>
                ${imageHtml}
                ${dailyNoteDisplay ? `<div style="font-size:0.85rem;opacity:0.6;margin-top:4px;border-top:1px solid #1a3450;padding-top:4px;">📝 ${dailyNoteDisplay}</div>` : ''}
                ${hotelNoteDisplay ? `<div style="font-size:0.8rem;opacity:0.5;margin-top:2px;">🏷️ ${hotelNoteDisplay}</div>` : ''}
                <div class="editable-fields" id="editFields_${data.day}">
                    <div class="field-row">
                        <label>🏨 住宿名称</label>
                        <input type="text" id="hotel_name_${data.day}" value="${data.hotel_name || ''}" placeholder="酒店名称" />
                    </div>
                    <div class="field-row">
                        <label>🏷️ 住宿备注</label>
                        <input type="text" id="hotel_note_${data.day}" value="${data.hotel_note || ''}" placeholder="地址/电话/备注" />
                    </div>
                    <div class="field-row">
                        <label>🎟️ 门票价格</label>
                        <input type="text" id="ticket_price_${data.day}" value="${data.ticket_price || ''}" placeholder="门票/通票价格" />
                    </div>
                    <div class="field-row">
                        <label>🚌 交通方式</label>
                        <input type="text" id="transport_note_${data.day}" value="${data.transport_note || ''}" placeholder="火车/大巴/飞机" />
                    </div>
                    <div class="field-row">
                        <label>📝 每日备注</label>
                        <textarea id="daily_note_${data.day}" placeholder="写点旅行心得...">${data.daily_note || ''}</textarea>
                    </div>
                    <div class="field-row">
                        <label>🖼️ 添加图片</label>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                            <button class="img-upload-btn" onclick="triggerUpload(${data.day})">
                                ➕ 选择图片
                                <input type="file" id="fileInput_${data.day}" accept="image/*" multiple onchange="handleFileUpload(${data.day}, this)" />
                            </button>
                            <span style="font-size:0.7rem;opacity:0.5;">支持多选</span>
                        </div>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;" id="imagePreview_${data.day}">
                        ${images.map(url => `<div style="position:relative;display:inline-block;"><img src="${url}" style="max-width:80px;max-height:60px;border-radius:6px;border:1px solid #1a3450;" /><button onclick="removeImage(${data.day}, '${url}')" style="position:absolute;top:-6px;right:-6px;background:#e05a5a;border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;line-height:18px;text-align:center;">×</button></div>`).join('')}
                    </div>
                    <div class="field-actions">
                        <button class="save-btn" onclick="saveEdits(${data.day})">💾 保存</button>
                        <button class="cancel-btn" onclick="cancelEdit(${data.day})">取消</button>
                    </div>
                </div>
            `;

            container.appendChild(entry);
        });

        if (selectedDay === null && !searchQuery.trim() && daysToShow.length > 0) {
            const hint = document.createElement('div');
            hint.style.cssText = 'text-align:center;opacity:0.4;font-size:0.85rem;padding:16px 0;border-top:1px solid #1a3450;margin-top:8px;';
            hint.textContent = '💡 点击任意一天可展开查看详情 · 点击「编辑」可修改内容';
            container.appendChild(hint);
        }

        const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
        const reminderItems = tripData.filter(d => {
            const note = d.daily_note || '';
            return reminderKeywords.some(kw => note.includes(kw));
        });
        document.getElementById('reminderCount').textContent = `⏰ ${reminderItems.length} 提醒`;

        // 汇率加载完成后，设置所有换算器
        if (exchangeRates) {
            document.querySelectorAll('.currency-converter').forEach(el => {
                const country = el.dataset.country;
                if (country) {
                    setTimeout(() => setupConverter(country), 100);
                }
            });
        }
    }

    // ================================================================
    //  编辑功能
    // ================================================================
    function toggleEdit(day) {
        const fields = document.getElementById(`editFields_${day}`);
        if (fields) {
            fields.classList.toggle('open');
            if (fields.classList.contains('open')) {
                fields.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }

    function cancelEdit(day) {
        const fields = document.getElementById(`editFields_${day}`);
        if (fields) fields.classList.remove('open');
        const data = getDayData(day);
        if (data) {
            document.getElementById(`hotel_name_${day}`).value = data.hotel_name || '';
            document.getElementById(`hotel_note_${day}`).value = data.hotel_note || '';
            document.getElementById(`ticket_price_${day}`).value = data.ticket_price || '';
            document.getElementById(`transport_note_${day}`).value = data.transport_note || '';
            document.getElementById(`daily_note_${day}`).value = data.daily_note || '';
        }
    }

    async function saveEdits(day) {
        const data = getDayData(day);
        if (!data) return;

        const hotel_name = document.getElementById(`hotel_name_${day}`).value.trim();
        const hotel_note = document.getElementById(`hotel_note_${day}`).value.trim();
        const ticket_price = document.getElementById(`ticket_price_${day}`).value.trim();
        const transport_note = document.getElementById(`transport_note_${day}`).value.trim();
        const daily_note = document.getElementById(`daily_note_${day}`).value.trim();

        await saveToSupabase(day, 'hotel_name', hotel_name);
        await saveToSupabase(day, 'hotel_note', hotel_note);
        await saveToSupabase(day, 'ticket_price', ticket_price);
        await saveToSupabase(day, 'transport_note', transport_note);
        await saveToSupabase(day, 'daily_note', daily_note);

        const fields = document.getElementById(`editFields_${day}`);
        if (fields) fields.classList.remove('open');

        refreshAll();
    }

    // ================================================================
    //  图片上传
    // ================================================================
    function triggerUpload(day) {
        document.getElementById(`fileInput_${day}`).click();
    }

    async function handleFileUpload(day, input) {
        const files = input.files;
        if (!files || files.length === 0) return;

        const data = getDayData(day);
        if (!data) return;

        let images = [];
        try {
            images = typeof data.image_urls === 'string' ? JSON.parse(data.image_urls) : (data.image_urls || []);
        } catch(e) { images = []; }

        const previewContainer = document.getElementById(`imagePreview_${day}`);
        const status = document.getElementById('syncStatus');
        status.textContent = '⏳ 上传图片中...';
        status.style.color = '#d4a574';

        let uploadedCount = 0;
        for (const file of files) {
            try {
                const url = await uploadToCloudinary(file);
                images.push(url);
                uploadedCount++;
                const imgDiv = document.createElement('div');
                imgDiv.style.cssText = 'position:relative;display:inline-block;';
                imgDiv.innerHTML = `
                    <img src="${url}" style="max-width:80px;max-height:60px;border-radius:6px;border:1px solid #1a3450;" />
                    <button onclick="removeImage(${day}, '${url}')" style="position:absolute;top:-6px;right:-6px;background:#e05a5a;border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;line-height:18px;text-align:center;">×</button>
                `;
                previewContainer.appendChild(imgDiv);
            } catch(err) {
                console.error('上传失败', err);
                status.textContent = '❌ 图片上传失败: ' + err.message;
                status.style.color = '#e05a5a';
            }
        }

        if (uploadedCount > 0) {
            await saveToSupabase(day, 'image_urls', JSON.stringify(images));
            status.textContent = `✅ 已上传 ${uploadedCount} 张图片`;
            status.style.color = '#6fcf97';
        }

        input.value = '';
        refreshAll();
    }

    async function removeImage(day, url) {
        const data = getDayData(day);
        if (!data) return;

        let images = [];
        try {
            images = typeof data.image_urls === 'string' ? JSON.parse(data.image_urls) : (data.image_urls || []);
        } catch(e) { images = []; }

        images = images.filter(u => u !== url);
        await saveToSupabase(day, 'image_urls', JSON.stringify(images));
        refreshAll();
    }

    // ================================================================
    //  月份翻页
    // ================================================================
    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentYear < 2027 || (currentYear === 2027 && currentMonth < 7)) {
            currentMonth = 7; currentYear = 2027;
        }
        if (currentYear > 2027 || (currentYear === 2027 && currentMonth > 9)) {
            currentMonth = 9; currentYear = 2027;
        }
        buildCalendar();
        renderDayList();
    }

    function goToTodayMonth() {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        if (currentYear < 2027 || (currentYear === 2027 && currentMonth < 7)) {
            currentMonth = 7; currentYear = 2027;
        }
        if (currentYear > 2027 || (currentYear === 2027 && currentMonth > 9)) {
            currentMonth = 9; currentYear = 2027;
        }
        buildCalendar();
        renderDayList();
        const td = getTodayDay();
        if (td >= 1 && td <= TOTAL_DAYS) jumpToDay(td);
    }

    // ================================================================
    //  跳转
    // ================================================================
    function jumpToDay(day) {
        if (day < 1) day = 1;
        if (day > TOTAL_DAYS) day = TOTAL_DAYS;
        selectedDay = day;
        currentDay = day;
        if (searchQuery.trim()) {
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.remove('visible');
        }
        const data = getDayData(day);
        if (data && data.date) {
            const parts = data.date.split('-');
            if (parts.length === 3) {
                currentYear = parseInt(parts[0]);
                currentMonth = parseInt(parts[1]) - 1;
            }
        }
        buildCalendar();
        renderDayList();
        document.getElementById('dayList').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('jumpInput').value = day;
    }

    function showAllDays() {
        selectedDay = null;
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearchBtn').classList.remove('visible');
        buildCalendar();
        renderDayList();
        document.getElementById('jumpInput').value = '';
    }

    // ================================================================
    //  刷新
    // ================================================================
    async function refreshAll() {
        await loadFromSupabase();
        // 重新获取汇率
        await fetchExchangeRates();
        buildCalendar();
        renderDayList();
        updateBookSummary();
        document.getElementById('syncStatus').textContent = '✅ 已同步';
        document.getElementById('syncStatus').style.color = '#6fcf97';
    }

    // ================================================================
    //  提醒汇总
    // ================================================================
    function updateBookSummary() {
        const container = document.getElementById('bookSummary');
        const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
        const reminders = tripData.filter(d => {
            const note = d.daily_note || '';
            return reminderKeywords.some(kw => note.includes(kw));
        });
        if (reminders.length === 0) {
            container.innerHTML = '<div style="opacity:0.5;text-align:center;padding:8px 0;">暂无预约/购票提醒</div>';
            return;
        }
        let html = '<div style="font-weight:500;margin-bottom:8px;color:#f9d77e;">⏰ 预约 & 购票提醒汇总</div>';
        reminders.forEach(d => {
            let displayText = d.daily_note || '';
            reminderKeywords.forEach(kw => {
                displayText = displayText.replace(kw, `<strong style="color:#f9d77e;">${kw}</strong>`);
            });
            if (displayText.length > 60) {
                displayText = displayText.slice(0, 60) + '…';
            }
            html += `
                <div class="item" onclick="jumpToDay(${d.day})">
                    <span class="label">Day ${d.day}</span>
                    <span class="date-tag">${d.date || ''}</span>
                    <span class="detail">${displayText}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    //  🔍 搜索框事件
    // ================================================================
    function setupSearch() {
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        input.addEventListener('input', function() {
            const val = this.value;
            if (val.trim()) {
                clearBtn.classList.add('visible');
                searchQuery = val;
                selectedDay = null;
                buildCalendar();
                renderDayList();
                updateBookSummary();
            } else {
                clearBtn.classList.remove('visible');
                searchQuery = '';
                selectedDay = null;
                buildCalendar();
                renderDayList();
                updateBookSummary();
            }
        });

        clearBtn.addEventListener('click', function() {
            input.value = '';
            clearBtn.classList.remove('visible');
            searchQuery = '';
            selectedDay = null;
            buildCalendar();
            renderDayList();
            updateBookSummary();
            input.focus();
        });
    }

    // ================================================================
    //  暴露全局函数
    // ================================================================
    window.jumpToDay = jumpToDay;
    window.showAllDays = showAllDays;
    window.getTodayDay = getTodayDay;
    window.changeMonth = changeMonth;
    window.goToTodayMonth = goToTodayMonth;
    window.refreshAll = refreshAll;
    window.toggleEdit = toggleEdit;
    window.cancelEdit = cancelEdit;
    window.saveEdits = saveEdits;
    window.triggerUpload = triggerUpload;
    window.handleFileUpload = handleFileUpload;
    window.removeImage = removeImage;

    // ================================================================
    //  初始化
    // ================================================================
    async function init() {
        // 加载行程数据
        await loadFromSupabase();

        // 获取实时汇率
        await fetchExchangeRates();

        // 设置搜索
        setupSearch();

        // 渲染日历和行程列表
        buildCalendar();
        renderDayList();
        updateBookSummary();

        console.log('🗓️ 环球旅行日历已加载 · 共70天');
        console.log('📅 Day1 = 2027-08-04 (周三)');
        console.log('☁️ Cloudinary 预设: kst_upload_2026');
        console.log('🌍 国家国旗映射已修正');
        console.log('💱 实时汇率已加载 (Frankfurter API)');
    }

    init();
</script>
</body>
