<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>🗺️ 环球旅行日历 · 行程管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1628;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #e5efff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #1e3a5a;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .header h1 small {
            font-size: 0.9rem;
            opacity: 0.5;
            font-weight: 300;
            margin-left: 12px;
        }
        .header .stats {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }
        .header .stats span {
            background: #142b44;
            padding: 4px 14px;
            border-radius: 30px;
            opacity: 0.8;
        }

        .quick-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 10px 16px;
            background: #0f1f33;
            border-radius: 14px;
            border: 1px solid #1a3450;
            align-items: center;
        }
        .quick-nav .nav-label {
            color: #6a8aaa;
            font-size: 0.8rem;
        }
        .quick-nav button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            font-family: inherit;
        }
        .quick-nav button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .quick-nav .reminder-btn {
            background: #e67e2233;
            border-color: #e67e2244;
            color: #f9d77e;
        }
        .quick-nav .reminder-btn:hover {
            background: #e67e2255;
            border-color: #e67e22;
        }
        .quick-nav .cost-btn {
            background: #4a9eff33;
            border-color: #4a9eff44;
            color: #4a9eff;
        }
        .quick-nav .cost-btn:hover {
            background: #4a9eff55;
            border-color: #4a9eff;
        }

        .year-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .year-tabs button {
            background: #0f1f33;
            border: 1px solid #1a3450;
            color: #6a8aaa;
            padding: 4px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .year-tabs button:hover {
            background: #1a3450;
            color: #e5efff;
        }
        .year-tabs button.active {
            background: #f9d77e22;
            border-color: #f9d77e;
            color: #f9d77e;
        }

        .calendar-wrapper {
            margin-bottom: 20px;
        }
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px 4px;
            border-bottom: 1px solid #1a3450;
            margin-bottom: 12px;
        }
        .month-nav .month-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: #f9d77e;
            letter-spacing: 2px;
        }
        .month-nav button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .month-nav button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .month-nav .today-btn-sm {
            background: #4caf50;
            color: #fff;
            font-weight: 500;
            font-size: 0.75rem;
            padding: 4px 12px;
        }
        .month-nav .today-btn-sm:hover {
            background: #66bb6a;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .calendar-grid .weekday {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            padding: 4px 0;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .day-cell {
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 8px;
            padding: 4px 3px;
            min-height: 58px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }
        .day-cell:hover {
            background: #1a3450;
            border-color: #f9d77e55;
            transform: scale(1.03);
            z-index: 2;
        }
        .day-cell .date {
            font-size: 0.65rem;
            opacity: 0.5;
            font-weight: 300;
        }
        .day-cell .day-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #f9d77e;
            margin-top: 1px;
        }
        .day-cell .city {
            font-size: 0.5rem;
            opacity: 0.6;
            text-align: center;
            line-height: 1.1;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }
        .day-cell .flag {
            font-size: 0.55rem;
            opacity: 0.5;
            margin-top: 1px;
        }
        .day-cell .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #f9d77e;
            margin-top: 2px;
            opacity: 0.5;
        }
        .day-cell .reminder-dot {
            background: #e67e22;
            opacity: 0.9;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .day-cell .today-dot {
            background: #4caf50;
            opacity: 1;
        }
        .day-cell .has-cost-dot {
            background: #6fcf97;
            opacity: 1;
        }
        .day-cell .add-hint {
            font-size: 0.4rem;
            opacity: 0.2;
            margin-top: 1px;
        }
        .day-cell .photo-indicator {
            font-size: 0.45rem;
            margin-top: 1px;
            color: #4a9eff;
            opacity: 0.6;
        }
        @keyframes pulse {
            0% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
        }
        .day-cell.empty {
            opacity: 0.1;
            cursor: default;
            pointer-events: none;
        }
        .day-cell.empty:hover {
            transform: none;
            background: #0f1f33;
            border-color: #1a3450;
        }
        .day-cell.today {
            border-color: #4caf50;
            background: #1a2a40;
            box-shadow: 0 0 20px #4caf5022;
        }
        .day-cell.selected {
            border-color: #f9d77e;
            background: #1a2a40;
            box-shadow: 0 0 20px #f9d77e33;
        }
        .day-cell.no-data {
            opacity: 0.5;
            cursor: pointer;
            border-color: #1a345066;
        }
        .day-cell.no-data:hover {
            opacity: 0.8;
            border-color: #4a9eff66;
            background: #0f1f33;
            transform: scale(1.03);
        }
        .day-cell.has-trip {
            border-color: #f9d77e33;
        }

        .nav-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }
        .nav-row button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .nav-row button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .nav-row .jump-input {
            background: #0f1f33;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 5px 10px;
            border-radius: 30px;
            width: 60px;
            text-align: center;
            font-size: 0.85rem;
        }
        .nav-row .jump-input:focus {
            outline: none;
            border-color: #f9d77e;
        }
        .nav-row .today-btn {
            background: #4caf50;
            color: #fff;
            font-weight: 600;
        }
        .nav-row .today-btn:hover {
            background: #66bb6a;
        }

        .day-detail {
            display: none;
            background: #0f1f33;
            border: 1px solid #f9d77e44;
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 16px;
            animation: fadeIn 0.3s ease;
        }
        .day-detail.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .day-detail .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #1a3450;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .day-detail .detail-header .day-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f9d77e;
        }
        .day-detail .detail-header .day-date {
            font-size: 0.85rem;
            opacity: 0.6;
        }
        .day-detail .detail-header .day-country {
            font-size: 0.9rem;
            background: #142b44;
            padding: 2px 14px;
            border-radius: 30px;
        }

        .day-detail .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 12px 0;
        }
        .day-detail .photo-gallery .photo-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1a3450;
            cursor: pointer;
            transition: 0.2s;
            background: #0a1a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .day-detail .photo-gallery .photo-thumb:hover {
            border-color: #f9d77e;
            transform: scale(1.05);
        }
        .day-detail .photo-gallery .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .day-detail .photo-gallery .photo-thumb .remove-photo {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e05a5a;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
            z-index: 2;
        }
        .day-detail .photo-gallery .photo-thumb:hover .remove-photo {
            opacity: 1;
        }

        .day-detail .sights {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .day-detail .sights span {
            background: #1a3450;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .day-detail .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 6px 0;
        }
        .day-detail .info-row .label {
            opacity: 0.4;
        }
        .day-detail .note {
            font-size: 0.85rem;
            opacity: 0.6;
            border-top: 1px solid #1a3450;
            padding-top: 10px;
            margin-top: 4px;
        }

        .day-detail .cost-breakdown {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin: 10px 0 8px 0;
            padding: 10px 14px;
            background: #0a1a2a;
            border-radius: 10px;
            border: 1px solid #1a3450;
        }
        .day-detail .cost-breakdown .cost-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .day-detail .cost-breakdown .cost-item .clabel {
            font-size: 0.6rem;
            opacity: 0.4;
            text-transform: uppercase;
        }
        .day-detail .cost-breakdown .cost-item .cvalue {
            font-size: 0.95rem;
            font-weight: 600;
            color: #6fcf97;
        }
        .day-detail .cost-breakdown .cost-item .cvalue.total {
            color: #f9d77e;
            font-size: 1.1rem;
        }

        .day-detail .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .day-detail .action-buttons button {
            padding: 6px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .day-detail .action-buttons .edit-btn {
            background: #4a9eff;
            color: #fff;
        }
        .day-detail .action-buttons .edit-btn:hover {
            background: #6ab4ff;
        }
        .day-detail .action-buttons .add-btn {
            background: #f9d77e;
            color: #0a1628;
        }
        .day-detail .action-buttons .add-btn:hover {
            background: #ffe28a;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            padding: 24px 22px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h2 {
            color: #f9d77e;
            margin-bottom: 14px;
            font-weight: 400;
            font-size: 1.2rem;
        }
        .modal-box .form-group {
            margin-bottom: 10px;
        }
        .modal-box .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #6a8aaa;
            margin-bottom: 3px;
        }
        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 6px 12px;
            background: #0a1a2a;
            border: 1px solid #1a3450;
            border-radius: 8px;
            color: #e5efff;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: #f9d77e;
        }
        .modal-box .form-group textarea {
            min-height: 50px;
            resize: vertical;
        }
        .modal-box .form-group select option {
            background: #0f1f33;
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal-box .cost-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .modal-box .cost-input-group input {
            flex: 1;
        }
        .modal-box .cost-input-group .currency-label {
            color: #6a8aaa;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        /* 照片上传区域 - 支持相册多选 */
        .modal-box .photo-upload-area {
            border: 1px dashed #1a3450;
            border-radius: 10px;
            padding: 10px 12px;
            background: #0a1a2a;
            margin-bottom: 8px;
        }
        .modal-box .photo-upload-area .photo-upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #4a9eff;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .photo-upload-area .photo-upload-btn:hover {
            background: #6ab4ff;
        }
        .modal-box .photo-upload-area .photo-upload-btn input[type="file"] {
            display: none;
        }
        .modal-box .photo-upload-area .upload-hint {
            color: #4a6a8a;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        .modal-box .photo-upload-area .upload-status {
            font-size: 0.7rem;
            color: #f9d77e;
            margin-left: 8px;
        }
        .modal-box .photo-upload-area .photo-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .modal-box .photo-upload-area .photo-preview-grid .preview-item {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1a3450;
            position: relative;
            background: #0a1a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box .photo-upload-area .photo-preview-grid .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-box .photo-upload-area .photo-preview-grid .preview-item .remove-photo-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e05a5a;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box .photo-upload-area .photo-preview-grid .preview-item .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: #f9d77e;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 7px 24px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-actions .save-btn {
            background: #f9d77e;
            color: #0a1628;
        }
        .modal-actions .save-btn:hover {
            background: #ffe28a;
        }
        .modal-actions .cancel-btn {
            background: #1a3450;
            color: #8ab4d6;
        }
        .modal-actions .cancel-btn:hover {
            background: #2a4a6a;
        }

        .cost-summary-panel {
            background: #0d1f30;
            border-radius: 14px;
            padding: 14px 18px;
            margin-top: 16px;
            border: 2px solid #f9d77e44;
        }
        .cost-summary-panel .cost-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .cost-summary-panel .cost-header .cost-title {
            font-size: 1rem;
            font-weight: 500;
            color: #f9d77e;
        }
        .cost-summary-panel .cost-header .cost-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .cost-summary-panel .cost-header .cost-actions button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .cost-summary-panel .cost-header .cost-actions button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .cost-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
            padding: 8px 12px;
            background: #0a1a2a;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #1a3450;
        }
        .cost-filter label {
            font-size: 0.7rem;
            color: #6a8aaa;
        }
        .cost-filter input[type="date"] {
            background: #0f1f33;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: inherit;
        }
        .cost-filter input[type="date"]:focus {
            outline: none;
            border-color: #f9d77e;
        }
        .cost-filter input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }
        .cost-filter button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .cost-filter button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .cost-filter .filter-result {
            color: #f9d77e;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .cost-items-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            align-items: center;
        }
        .cost-item-summary {
            display: flex;
            flex-direction: column;
            gap: 1px;

                            hotel_price: 0,

                            ticket_price_num: 0,
                            food_price: 0,
                            food_note: '',
                            other_price: 0,
                            other_note: ''
                        });
                    }
                }
            } catch (err) {
                console.warn('加载失败', err);
                const cached = localStorage.getItem('tripData_cache');
                if (cached) {
                    try { tripData = JSON.parse(cached); } catch (e) {}
                }
            }
            localStorage.setItem('tripData_cache', JSON.stringify(tripData));
            overlay.classList.remove('active');
            return tripData;
        }

        async function saveToSupabase(day, field, value) {
            try {
                const res = await fetch(`${SUPABASE_URL}trip_days?day=eq.${day}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({ [field]: value, updated_at: new Date().toISOString() })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json();
                const idx = tripData.findIndex(d => d.day === day);
                if (idx !== -1) tripData[idx] = { ...tripData[idx], ...result[0] };
                localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                return true;
            } catch (err) {
                console.error('保存失败', err);
                const idx = tripData.findIndex(d => d.day === day);
                if (idx !== -1) { tripData[idx][field] = value;
                    localStorage.setItem('tripData_cache', JSON.stringify(tripData)); }
                return false;
            }
        }

        async function createNewTrip(day, data) {
            const date = getDateFromDay(day);
            const newData = {
                day: day,
                date: date.toISOString().split('T')[0],
                city: data.city || `Day ${day}`,
                country: data.country || '待定',
                sights: JSON.stringify(data.sights ? data.sights.split(',').map(s => s.trim()) : ['待补充']),
                hotel_name: data.hotel_name || '',
                hotel_note: '',
                daily_note: data.daily_note || '',
                ticket_price: '',
                transport_note: '',
                image_urls: JSON.stringify(data.image_urls || []),
                hotel_price: parseFloat(data.hotel_price) || 0,
                transport_price: parseFloat(data.transport_price) || 0,
                ticket_price_num: parseFloat(data.ticket_price) || 0,
                food_price: parseFloat(data.food_price) || 0,
                food_note: '',
                other_price: parseFloat(data.other_price) || 0,
                other_note: ''
            };
            try {
                const res = await fetch(`${SUPABASE_URL}trip_days`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newData)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                tripData.push(newData);
                localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                return true;
            } catch (e) { console.warn(e); return false; }
        }

        // ================================================================
        //  Cloudinary 上传
        // ================================================================
        function uploadToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.secure_url) {
                            resolve(data.secure_url);
                        } else {
                            reject(new Error('Cloudinary 返回错误: ' + JSON.stringify(data)));
                        }
                    })
                    .catch(err => reject(err));
            });
        }

        // ================================================================

        function buildCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            weekdays.forEach(d => {
                const el = document.createElement('div');
                el.className = 'weekday';
                el.textContent = d;
                grid.appendChild(el);
            });

            const firstDay = new Date(currentYear, currentMonth, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = getDaysInMonth(currentYear, currentMonth);
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('monthTitle').textContent = `${currentYear}年${monthNames[currentMonth]}`;

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                const dayNum = getDayNumberForDate(currentYear, currentMonth, d);
                const inRange = isInTripRange(currentYear, currentMonth, d);

                cell.className = 'day-cell';

                if (inRange && dayNum !== null) {
                    const data = getDayData(dayNum);
                    const dateEl = document.createElement('div');
                    dateEl.className = 'date';
                    dateEl.textContent = `${currentMonth+1}/${d}`;
                    cell.appendChild(dateEl);

                    if (data && data.city && data.city !== `Day ${dayNum}`) {
                        const dayLabel = document.createElement('div');
                        dayLabel.className = 'day-label';
                        dayLabel.textContent = `Day${data.day}`;
                        cell.appendChild(dayLabel);

                        const cityEl = document.createElement('div');
                        cityEl.className = 'city';
                        cityEl.textContent = data.city && data.city.length > 8 ? data.city.slice(0, 8) + '…' : (data.city ||
                        '');
                        cell.appendChild(cityEl);

                        const flagEl = document.createElement('div');
                        flagEl.className = 'flag';
                        flagEl.textContent = getCountryFlag(data.country) || '🌍';
                        cell.appendChild(flagEl);

                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        const hasCost = (parseFloat(data.hotel_price) > 0) || (parseFloat(data.transport_price) > 0) ||
                            (parseFloat(data.ticket_price_num) > 0) || (parseFloat(data.food_price) > 0) ||
                            (parseFloat(data.other_price) > 0);
                        if (hasCost) dot.classList.add('has-cost-dot');
                        const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
                        const hasReminder = reminderKeywords.some(kw => (data.daily_note || '').includes(kw));
                        if (hasReminder) dot.classList.add('reminder-dot');
                        if (dayNum === getTodayDay()) dot.classList.add('today-dot');
                        cell.appendChild(dot);

                        let photoUrls = [];
                        try { photoUrls = JSON.parse(data.image_urls || '[]'); } catch (e) {}
                        if (photoUrls.length > 0) {
                            const photoInd = document.createElement('div');
                            photoInd.className = 'photo-indicator';
                            photoInd.textContent = `📷 ${photoUrls.length}`;
                            cell.appendChild(photoInd);
                        }

                        if (dayNum === getTodayDay()) cell.classList.add('today');
                        if (dayNum === currentDay) cell.classList.add('selected');

                        cell.dataset.day = dayNum;
                        cell.addEventListener('click', () => { jumpToDay(dayNum); });
                        cell.classList.add('has-trip');
                    } else {
                        cell.classList.add('no-data');
                        const addHint = document.createElement('div');
                        addHint.className = 'add-hint';
                        addHint.textContent = '+ 添加';
                        cell.appendChild(addHint);
                        cell.dataset.day = dayNum;
                        cell.addEventListener('click', () => { openTripModal(dayNum); });
                    }
                } else {
                    cell.classList.add('no-data');
                    const dateEl = document.createElement('div');
                    dateEl.className = 'date';
                    dateEl.textContent = `${currentMonth+1}/${d}`;
                    cell.appendChild(dateEl);
                    const addHint = document.createElement('div');
                    addHint.className = 'add-hint';
                    addHint.textContent = '+ 添加';
                    cell.appendChild(addHint);
                    cell.dataset.day = 'outside';
                    cell.dataset.dateKey =
                    `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    cell.addEventListener('click', function() {
                        const dateKey = this.dataset.dateKey;
                        openOutsideTripModal(dateKey);
                    });
                }
                grid.appendChild(cell);
            }
        }

        // ================================================================
        //  照片管理（相册多选 + Cloudinary 上传）
        // ================================================================
        function setupPhotoUpload() {
            const fileInput = document.getElementById('photoFileInput');
            fileInput.addEventListener('change', function(e) {
                const files = this.files;
                if (files.length === 0) return;
                if (files.length > 10) {
                    alert('最多选择10张照片');
                    this.value = '';
                    return;
                }
                // 显示上传状态
                const statusEl = document.getElementById('uploadStatus');
                statusEl.textContent = `⏳ 正在上传 ${files.length} 张...`;
                statusEl.style.color = '#f9d77e';

                let uploaded = 0;
                const total = files.length;

                Array.from(files).forEach(file => {
                    // 先显示占位图
                    const reader = new FileReader();
                    reader.onload = function(e2) {
                        const placeholderUrl = e2.target.result;
                        addPhotoPreviewPlaceholder(placeholderUrl);
                    };
                    reader.readAsDataURL(file);

                    // 上传到 Cloudinary
                    uploadToCloudinary(file)
                        .then(url => {
                            formPhotos.push(url);
                            uploaded++;
                            statusEl.textContent = `✅ 已上传 ${uploaded}/${total}`;
                            statusEl.style.color = '#6fcf97';
                            // 更新预览（替换占位）
                            renderFormPhotos();
                            if (uploaded === total) {
                                statusEl.textContent = `✅ 全部上传完成 (${total}张)`;
                                setTimeout(() => { statusEl.textContent = ''; }, 3000);
                            }
                        })
                        .catch(err => {
                            console.error('上传失败', err);
                            uploaded++;
                            statusEl.textContent = `❌ 上传失败 ${uploaded}/${total}`;
                            statusEl.style.color = '#e05a5a';
                            // 移除该占位（简化处理，重新渲染）
                            renderFormPhotos();
                            if (uploaded === total) {
                                setTimeout(() => { statusEl.textContent = ''; }, 3000);
                            }
                        });
                });
                // 清空 input，允许重复选择相同文件
                this.value = '';
            });
        }

        async function saveTrip() {
            const day = parseInt(document.getElementById('editDay').value);
            const dateStr = document.getElementById('tripDate').value;
            const city = document.getElementById('tripCity').value.trim() || '新行程';
            const country = document.getElementById('tripCountry').value;
            const sights = document.getElementById('tripSights').value.trim() || '待探索';
            const note = document.getElementById('tripNote').value.trim();
            const hotelPrice = parseFloat(document.getElementById('tripHotelPrice').value) || 0;
            const transportPrice = parseFloat(document.getElementById('tripTransportPrice').value) || 0;
            const ticketPrice = parseFloat(document.getElementById('tripTicketPrice').value) || 0;
            const foodPrice = parseFloat(document.getElementById('tripFoodPrice').value) || 0;
            const otherPrice = parseFloat(document.getElementById('tripOtherPrice').value) || 0;

            if (!day || isNaN(day)) {
                alert('请选择有效的日期');
                return;
            }

            const existing = getDayData(day);
            if (existing && existing.city !== `Day ${day}`) {
                await saveToSupabase(day, 'city', city);
                await saveToSupabase(day, 'country', country);
                await saveToSupabase(day, 'sights', JSON.stringify(sights.split(',').map(s => s.trim())));
                await saveToSupabase(day, 'daily_note', note);
                await saveToSupabase(day, 'hotel_price', hotelPrice);
                await saveToSupabase(day, 'transport_price', transportPrice);
                await saveToSupabase(day, 'ticket_price_num', ticketPrice);
                await saveToSupabase(day, 'food_price', foodPrice);
                await saveToSupabase(day, 'other_price', otherPrice);
                if (formPhotos.length > 0) {
                    await saveToSupabase(day, 'image_urls', JSON.stringify(formPhotos));
                }
            } else {
                await createNewTrip(day, {
                    city,
                    country,
                    sights,
                    daily_note: note,
                    hotel_price: hotelPrice,
                    transport_price: transportPrice,
                    ticket_price: ticketPrice,
                    food_price: foodPrice,
                    other_price: otherPrice,
                    image_urls: formPhotos
                });
            }

            closeTripModal();
            refreshAll();
            jumpToDay(day);
        }

        // ================================================================
        //  费用统计
        // ================================================================
        function getCosts(fromDate, toDate) {
            let hotelTotal = 0,
                transportTotal = 0,
                ticketTotal = 0,
                foodTotal = 0,
                otherTotal = 0;
            const filtered = tripData.filter(d => {
                if (!d.date) return true;
                if (fromDate && d.date < fromDate) return false;
                if (toDate && d.date > toDate) return false;
                if (d.city === `Day ${d.day}`) return false;
                return true;
            });
            filtered.forEach(d => {
                hotelTotal += parseFloat(d.hotel_price) || 0;
                transportTotal += parseFloat(d.transport_price) || 0;
                ticketTotal += parseFloat(d.ticket_price_num) || 0;
                foodTotal += parseFloat(d.food_price) || 0;
                otherTotal += parseFloat(d.other_price) || 0;
            });
            return { hotelTotal, transportTotal, ticketTotal, foodTotal, otherTotal, allTotal: hotelTotal + transportTotal +
                    ticketTotal + foodTotal + otherTotal };
        }

        function updateCostSummary() {
            const from = document.getElementById('filterDateFrom').value || null;
            const to = document.getElementById('filterDateTo').value || null;
            const costs = getCosts(from, to);
            document.getElementById('totalHotelCost').textContent = `¥${costs.hotelTotal.toFixed(0)}`;
            document.getElementById('totalTransportCost').textContent = `¥${costs.transportTotal.toFixed(0)}`;
            document.getElementById('totalTicketCost').textContent = `¥${costs.ticketTotal.toFixed(0)}`;
            document.getElementById('totalFoodCost').textContent = `¥${costs.foodTotal.toFixed(0)}`;
            document.getElementById('totalOtherCost').textContent = `¥${costs.otherTotal.toFixed(0)}`;
            document.getElementById('totalAllCost').textContent = `¥${costs.allTotal.toFixed(0)}`;
            document.getElementById('filterResult').textContent = from || to ? `📅 ${from || '开始'} ~ ${to || '结束'}` :
                '📊 显示全部';
        }

        function applyCostFilter() { updateCostSummary(); }

        function resetCostFilter() {
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            updateCostSummary();
        }

        async function clearAllCosts() {
            if (!confirm('确定要清空所有费用数据吗？')) return;
            for (const d of tripData) {
                await saveToSupabase(d.day, 'hotel_price', 0);
                await saveToSupabase(d.day, 'transport_price', 0);
                await saveToSupabase(d.day, 'ticket_price_num', 0);
                await saveToSupabase(d.day, 'food_price', 0);
                await saveToSupabase(d.day, 'other_price', 0);
            }
            await loadFromSupabase();
            refreshAll();
        }

        // ================================================================
        //  提醒汇总
        // ================================================================
        function updateBookSummary() {
            const container = document.getElementById('bookSummary');
            const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
            const reminders = tripData.filter(d => {
                const note = d.daily_note || '';
                return reminderKeywords.some(kw => note.includes(kw)) && d.city !== `Day ${d.day}`;
            });
            if (reminders.length === 0) {
                container.innerHTML = '<div style="opacity:0.5;text-align:center;padding:6px 0;">暂无预约/购票提醒</div>';
                document.getElementById('reminderCount').textContent = '⏰ 0 提醒';
                return;
            }
            let html = '<div style="font-weight:500;margin-bottom:6px;color:#f9d77e;font-size:0.9rem;">⏰ 预约 & 购票提醒</div>';
            reminders.forEach(d => {
                let displayText = d.daily_note || '';
                reminderKeywords.forEach(kw => {
                    displayText = displayText.replace(kw, `<strong style="color:#f9d77e;">${kw}</strong>`);
                });
                if (displayText.length > 50) displayText = displayText.slice(0, 50) + '…';
                html += `
                    <div class="item" onclick="jumpToDay(${d.day})">
                        <div class="left-part">
                            <span class="label">Day ${d.day}</span>
                            <span class="date-tag">${d.date || ''}</span>
                            <span class="detail">${displayText}</span>
                        </div>
                        <button class="delete-reminder-btn" onclick="event.stopPropagation();deleteReminder(${d.day})" title="删除提醒">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('reminderCount').textContent = `⏰ ${reminders.length} 提醒`;
        }

        async function deleteReminder(day) {
            if (!confirm(`确定删除 Day ${day} 的预约/购票提醒吗？`)) return;
            const data = getDayData(day);
            if (!data) return;
            const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
            let note = data.daily_note || '';
            reminderKeywords.forEach(kw => {
                note = note.replace(new RegExp(kw, 'g'), '');
            });
            note = note.replace(/\s+/g, ' ').trim();
            await saveToSupabase(day, 'daily_note', note);
            refreshAll();
            jumpToDay(day);
        }

        // ================================================================
        //  导航
        // ================================================================
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0;
                currentYear++; } else if (currentMonth < 0) { currentMonth = 11;
                currentYear--; }
            if (currentYear < 2026) { currentYear = 2026;
                currentMonth = 0; }
            if (currentYear > 2028) { currentYear = 2028;
                currentMonth = 11; }
            buildCalendar();
        }

        function goToTodayMonth() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            if (currentYear < 2026) { currentYear = 2026;
                currentMonth = 0; }
            if (currentYear > 2028) { currentYear = 2028;
                currentMonth = 11; }
            buildCalendar();
            jumpToDay(getTodayDay());
        }

        function scrollToReminders() {
            document.getElementById('bookSummary').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function scrollToCostPanel() {
            document.getElementById('costSummaryPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ================================================================
        //  年份切换
        // ================================================================
        function setupYearTabs() {
            document.querySelectorAll('.year-tabs button').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.year-tabs button').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentYear = parseInt(this.dataset.year);
                    currentMonth = 0;
                    buildCalendar();
                });
            });
        }

        // ================================================================
        //  刷新
        // ================================================================
        async function refreshAll() {
            await loadFromSupabase();
            buildCalendar();
            if (currentDay) {
                showDayDetail(currentDay);
            }
            updateCostSummary();
            updateBookSummary();
            document.getElementById('syncStatus').textContent = '✅ 已同步';
            document.getElementById('syncStatus').style.color = '#6fcf97';
            const countries = new Set(tripData.map(d => d.country).filter(c => c && c !== '待定' && c !== 'Day'));
            document.getElementById('totalCountriesDisplay').textContent = countries.size;
        }

        // 暴露全局函数
        window.jumpToDay = jumpToDay;
        window.changeMonth = changeMonth;
        window.goToTodayMonth = goToTodayMonth;
        window.refreshAll = refreshAll;
        window.openTripModal = openTripModal;
        window.closeTripModal = closeTripModal;
        window.saveTrip = saveTrip;
        window.editCurrentDay = editCurrentDay;
        window.addCostToCurrentDay = addCostToCurrentDay;
        window.applyCostFilter = applyCostFilter;
        window.resetCostFilter = resetCostFilter;
        window.clearAllCosts = clearAllCosts;
        window.scrollToReminders = scrollToReminders;
        window.scrollToCostPanel = scrollToCostPanel;
        window.getTodayDay = getTodayDay;
        window.removeFormPhoto = removeFormPhoto;
        window.removePhotoFromDay = removePhotoFromDay;
        window.deleteReminder = deleteReminder;

        // ================================================================
        //  初始化
        // ================================================================
        async function init() {
            populateCountrySelect();
            await loadFromSupabase();
            setupYearTabs();
            setupPhotoUpload();

            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            if (currentYear < 2026) { currentYear = 2026;
                currentMonth = 0; }
            if (currentYear > 2028) { currentYear = 2028;
                currentMonth = 11; }

            buildCalendar();

            const todayDay = getTodayDay();
            if (todayDay >= 1 && todayDay <= TOTAL_DAYS) {
                jumpToDay(todayDay);
            } else {
                jumpToDay(1);
            }

            updateCostSummary();
            updateBookSummary();

            const countries = new Set(tripData.map(d => d.country).filter(c => c && c !== '待定' && c !== 'Day'));
            document.getElementById('totalCountriesDisplay').textContent = countries.size;

            console.log('🗺️ 环球旅行日历已加载 · 支持相册多选上传照片');
            console.log('☁️ Cloudinary 已配置:', CLOUD_NAME);
        }

        init();
    </script>
</body>
</html>
