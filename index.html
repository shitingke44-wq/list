<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=no" />
    <title>🗺️ 环球旅行日历</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1628;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #e5efff;
            padding: 0;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            height: 96vh;
            max-height: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: #0a1628;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #1e3a5a44;
        }

        /* ===== 页面滑动 ===== */
        .pages-wrapper {
            display: flex;
            flex: 1;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }
        .page {
            min-width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 16px 70px 16px;
            -webkit-overflow-scrolling: touch;
        }
        .page::-webkit-scrollbar {
            width: 3px;
        }
        .page::-webkit-scrollbar-thumb {
            background: #1a3450;
            border-radius: 10px;
        }

        .pages-wrapper.page-1 {
            transform: translateX(0);
        }
        .pages-wrapper.page-2 {
            transform: translateX(-100%);
        }
        .pages-wrapper.page-3 {
            transform: translateX(-200%);
        }
        .pages-wrapper.page-4 {
            transform: translateX(-300%);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid #1e3a5a;
            flex-shrink: 0;
        }
        .page-header .page-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #f9d77e;
            flex: 1;
        }
        .page-header .page-action {
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* ===== 底部导航栏 ===== */
        .bottom-nav {
            display: flex;
            background: #0d1a2e;
            border-top: 1px solid #1a3450;
            padding: 6px 0 10px 0;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }
        .bottom-nav .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 0;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: transparent;
            color: #4a6a8a;
            font-family: inherit;
            font-size: 0.6rem;
            position: relative;
        }
        .bottom-nav .nav-item i {
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .bottom-nav .nav-item span {
            font-size: 0.55rem;
            opacity: 0.7;
        }
        .bottom-nav .nav-item:hover {
            color: #8ab4d6;
        }
        .bottom-nav .nav-item.active {
            color: #f9d77e;
        }
        .bottom-nav .nav-item.active i {
            transform: scale(1.1);
        }
        .bottom-nav .nav-item .badge {
            position: absolute;
            top: 0;
            right: 50%;
            transform: translateX(calc(50% + 18px));
            background: #e67e22;
            color: #fff;
            font-size: 0.5rem;
            padding: 1px 6px;
            border-radius: 30px;
            min-width: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* ===== 页面1：日历主页 ===== */
        .home-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .home-stats span {
            background: #142b44;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #0f1f33;
            border-radius: 12px;
            border: 1px solid #1a3450;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 120px;
            background: #0a1a2a;
            border: 1px solid #1a3450;
            border-radius: 30px;
            padding: 5px 14px;
            color: #e5efff;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }
        .search-bar input:focus {
            border-color: #f9d77e;
        }
        .search-bar input::placeholder {
            color: #4a6a8a;
        }
        .search-bar .search-btn {
            background: #4a9eff;
            border: none;
            color: #fff;
            padding: 5px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
        }
        .search-bar .search-btn:hover {
            background: #6ab4ff;
        }
        .search-bar .clear-search-btn {
            background: transparent;
            border: 1px solid #e05a5a44;
            color: #e05a5a;
            padding: 3px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.65rem;
            display: none;
        }
        .search-bar .clear-search-btn.visible {
            display: inline-block;
        }

        .search-results-dropdown {
            display: none;
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 12px;
            margin-bottom: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .search-results-dropdown.active {
            display: block;
        }
        .search-results-dropdown .result-item {
            padding: 6px 14px;
            cursor: pointer;
            border-bottom: 1px solid #1a345044;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-results-dropdown .result-item:hover {
            background: #1a3450;
        }
        .search-results-dropdown .result-item .r-city {
            color: #f9d77e;
        }
        .search-results-dropdown .result-item .r-date {
            opacity: 0.5;
            font-size: 0.7rem;
        }
        .search-results-dropdown .no-result {
            padding: 16px;
            text-align: center;
            opacity: 0.5;
            font-size: 0.8rem;
        }

        .year-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .year-tabs button {
            background: #0f1f33;
            border: 1px solid #1a3450;
            color: #6a8aaa;
            padding: 3px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .year-tabs button:hover {
            background: #1a3450;
            color: #e5efff;
        }
        .year-tabs button.active {
            background: #f9d77e22;
            border-color: #f9d77e;
            color: #f9d77e;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 8px 0;
            border-bottom: 1px solid #1a3450;
            margin-bottom: 10px;
        }
        .month-nav .month-title {
            font-size: 1rem;
            font-weight: 400;
            color: #f9d77e;
            cursor: pointer;
            user-select: none;
        }
        .month-nav .month-title i {
            font-size: 0.6rem;
            opacity: 0.5;
            margin-left: 4px;
        }
        .month-nav button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .month-nav button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .month-nav .today-btn-sm {
            background: #4caf50;
            color: #fff;
            font-size: 0.65rem;
            padding: 3px 10px;
        }

        .month-dropdown {
            display: none;
            position: absolute;
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 10px;
            padding: 4px 0;
            z-index: 200;
            max-height: 180px;
            overflow-y: auto;
            min-width: 120px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .month-dropdown .month-option {
            padding: 4px 16px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.15s;
        }
        .month-dropdown .month-option:hover {
            background: #1a3450;
            color: #f9d77e;
        }
        .month-dropdown .month-option.active {
            background: #f9d77e22;
            color: #f9d77e;
        }
        .month-dropdown .year-row {
            padding: 4px 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1a3450;
            margin-top: 4px;
            padding-top: 6px;
            justify-content: center;
            align-items: center;
        }
        .month-dropdown .year-row button {
            background: transparent;
            border: 1px solid #1a3450;
            color: #6a8aaa;
            padding: 1px 8px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.65rem;
        }
        .month-dropdown .year-row button:hover {
            background: #1a3450;
            color: #e5efff;
        }
        .month-dropdown .year-row .year-label {
            color: #f9d77e;
            font-size: 0.8rem;
            min-width: 36px;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-grid .weekday {
            text-align: center;
            font-size: 0.65rem;
            opacity: 0.4;
            padding: 2px 0;
            font-weight: 500;
        }
        .day-cell {
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 6px;
            padding: 3px 2px;
            min-height: 48px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }
        .day-cell:hover {
            background: #1a3450;
            border-color: #f9d77e55;
            transform: scale(1.03);
            z-index: 2;
        }
        .day-cell .date {
            font-size: 0.55rem;
            opacity: 0.5;
        }
        .day-cell .day-label {
            font-size: 0.5rem;
            font-weight: 600;
            color: #f9d77e;
            margin-top: 1px;
        }
        .day-cell .city {
            font-size: 0.45rem;
            opacity: 0.6;
            text-align: center;
            line-height: 1;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 1px;
        }
        .day-cell .flag {
            font-size: 0.5rem;
            opacity: 0.5;
            margin-top: 1px;
        }
        .day-cell .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #f9d77e;
            margin-top: 1px;
            opacity: 0.5;
        }
        .day-cell .reminder-dot {
            background: #e67e22;
            opacity: 0.9;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .day-cell .today-dot {
            background: #4caf50;
            opacity: 1;
        }
        .day-cell .has-cost-dot {
            background: #6fcf97;
            opacity: 1;
        }
        .day-cell .add-hint {
            font-size: 0.35rem;
            opacity: 0.2;
            margin-top: 1px;
        }
        .day-cell .photo-indicator {
            font-size: 0.4rem;
            margin-top: 1px;
            color: #4a9eff;
            opacity: 0.6;
        }
        .day-cell .outside-trip-badge {
            font-size: 0.4rem;
            background: #4a9eff33;
            color: #4a9eff;
            border-radius: 8px;
            padding: 0 3px;
            margin-top: 1px;
        }
        @keyframes pulse {
            0% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
        }
        .day-cell.empty {
            opacity: 0.1;
            cursor: default;
            pointer-events: none;
        }
        .day-cell.empty:hover {
            transform: none;
            background: #0f1f33;
            border-color: #1a3450;
        }
        .day-cell.today {
            border-color: #4caf50;
            background: #1a2a40;
            box-shadow: 0 0 16px #4caf5022;
        }
        .day-cell.selected {
            border-color: #f9d77e;
            background: #1a2a40;
            box-shadow: 0 0 16px #f9d77e33;
        }
        .day-cell.no-data {
            opacity: 0.5;
            cursor: pointer;
            border-color: #1a345066;
        }
        .day-cell.no-data:hover {
            opacity: 0.8;
            border-color: #4a9eff66;
        }
        .day-cell.has-trip {
            border-color: #f9d77e33;
        }
        .day-cell.has-outside-trip {
            border-color: #4a9eff44;
        }

        .nav-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
            align-items: center;
        }
        .nav-row button {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .nav-row button:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .nav-row .jump-input {
            background: #0f1f33;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 6px;
            border-radius: 30px;
            width: 44px;
            text-align: center;
            font-size: 0.75rem;
        }
        .nav-row .jump-input:focus {
            outline: none;
            border-color: #f9d77e;
        }
        .nav-row .today-btn {
            background: #4caf50;
            color: #fff;
            font-weight: 600;
            font-size: 0.7rem;
        }
        .nav-row .today-btn:hover {
            background: #66bb6a;
        }

        /* ===== 页面2：行程详情 ===== */
        .detail-body .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 10px 0;
        }
        .detail-body .photo-gallery .photo-thumb {
            width: 64px;
            height: 64px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1a3450;
            cursor: pointer;
            background: #0a1a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .detail-body .photo-gallery .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-body .photo-gallery .photo-thumb .remove-photo {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e05a5a;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
        }
        .detail-body .photo-gallery .photo-thumb:hover .remove-photo {
            opacity: 1;
        }

        .detail-body .sights {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            margin: 4px 0;
        }
        .detail-body .sights span {
            background: #1a3450;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
        }
        .detail-body .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 4px 0;
        }
        .detail-body .info-row .label {
            opacity: 0.4;
        }
        .detail-body .note {
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid #1a3450;
            padding-top: 8px;
            margin-top: 4px;
        }

        .detail-body .cost-breakdown {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin: 8px 0 6px 0;
            padding: 8px 12px;
            background: #0a1a2a;
            border-radius: 8px;
            border: 1px solid #1a3450;
        }
        .detail-body .cost-breakdown .cost-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .detail-body .cost-breakdown .cost-item .clabel {
            font-size: 0.5rem;
            opacity: 0.4;
            text-transform: uppercase;
        }
        .detail-body .cost-breakdown .cost-item .cvalue {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6fcf97;
        }
        .detail-body .cost-breakdown .cost-item .cvalue.total {
            color: #f9d77e;
            font-size: 1rem;
        }

        /* ===== 汇率转换 ===== */
        .exchange-widget {
            background: #0a1a2a;
            border: 1px solid #f9d77e44;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 8px 0 10px 0;
            display: flex !important;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
        }
        .exchange-widget .exchange-label {
            font-size: 0.65rem;
            color: #f9d77e;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .exchange-widget .direction-toggle {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 3px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.6rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .exchange-widget .direction-toggle:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .exchange-widget .direction-toggle.active {
            background: #f9d77e22;
            border-color: #f9d77e;
            color: #f9d77e;
        }
        .exchange-widget .exchange-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .exchange-widget .exchange-input-group input {
            background: #0f1f33;
            border: 1px solid #1a3450;
            border-radius: 4px;
            padding: 3px 8px;
            color: #e5efff;
            font-size: 0.8rem;
            width: 80px;
            font-family: inherit;
        }
        .exchange-widget .exchange-input-group input:focus {
            outline: none;
            border-color: #f9d77e;
        }
        .exchange-widget .exchange-input-group .currency-code {
            color: #6a8aaa;
            font-size: 0.7rem;
            font-weight: 600;
            min-width: 24px;
        }
        .exchange-widget .exchange-result {
            color: #6fcf97;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .exchange-widget .exchange-result .rate-info {
            color: #4a6a8a;
            font-size: 0.55rem;
            margin-left: 4px;
        }
        .exchange-widget .exchange-rate-info {
            color: #4a6a8a;
            font-size: 0.6rem;
        }
        .exchange-widget .exchange-refresh {
            background: #142b44;
            border: 1px solid #1a3450;
            color: #e5efff;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.6rem;
            font-family: inherit;
            transition: 0.2s;
            margin-left: auto;
        }
        .exchange-widget .exchange-refresh:hover {
            background: #1a3450;
            border-color: #f9d77e55;
        }
        .exchange-widget.hidden {
            display: none !important;
        }

        .detail-body .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .detail-body .action-buttons button {
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            border: none;
            transition: 0.2s;
        }
        .detail-body .action-buttons .edit-btn {
            background: #4a9eff;
            color: #fff;
        }
        .detail-body .action-buttons .edit-btn:hover {
            background: #6ab4ff;
        }
        .detail-body .action-buttons .add-btn {
            background: #f9d77e;
            color: #0a1628;
        }
        .detail-body .action-buttons .add-btn:hover {
            background: #ffe28a;
        }
        .detail-body .action-buttons .delete-btn {
            background: #e05a5a44;
            color: #e05a5a;
            border: 1px solid #e05a5a44;
        }
        .detail-body .action-buttons .delete-btn:hover {
            background: #e05a5a66;
        }
        .detail-body .detail-country-display {
            font-size: 0.9rem;
            background: #142b44;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .detail-body .detail-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f9d77e;
        }
        .detail-body .trip-type-badge {
            font-size: 0.65rem;
            background: #4a9eff33;
            color: #4a9eff;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #4a9eff44;
            display: inline-block;
        }

        .empty-state {
            text-align: center;

                return 0.14;
            }

        function updateExchangeResult(val) {
            const foreignCurrency = currentForeignCurrency;
            if (!foreignCurrency || !currentExchangeRate) return;
            const cnyToForeign = currentExchangeRate;

            let result, rateInfoText;
            if (exchangeDirection === 'cny_to_foreign') {
                result = val * cnyToForeign;
                rateInfoText = `1 ${foreignCurrency} ≈ ${foreignToCny.toFixed(4)} CNY`;
            } else {
                result = val * foreignToCny;
                rateInfoText = `1 CNY ≈ ${cnyToForeign.toFixed(4)} ${foreignCurrency}`;
            }
            const resultEl = document.getElementById('exchangeResult');
            if (resultEl) {
                resultEl.innerHTML = `= ${result.toFixed(2)} <span class="rate-info">${rateInfoText}</span>`;
            }
        }

        async function loadFromSupabase() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');
            try {
                const res = await fetch(`${SUPABASE_URL}trip_days?select=*&order=day.asc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.length > 0) {
                    tripData = data;
                } else {
                    tripData = [];
                    for (let i = 1; i <= TOTAL_DAYS; i++) {
                        const date = getDateFromDay(i);
                        const dateKey = date.toISOString().split('T')[0];
                        tripData.push({
                            day: i,
                            date: dateKey,
                            date_key: dateKey,
                            city: `Day ${i}`,
                            country: '待定',
                            sights: JSON.stringify(['待补充']),
                            hotel_name: '',
                            hotel_note: '',
                            daily_note: '',
                            ticket_price: '',
                            transport_note: '',
                            image_urls: JSON.stringify([]),
                            hotel_price: 0,
                            transport_price: 0,
                            ticket_price_num: 0,
                            food_price: 0,
                            food_note: '',
                            other_price: 0,
                            other_note: '',
                            is_outside: false
                        });
                    }
                }
                tripData.forEach(d => {
                    if (!d.date_key) {
                        const date = new Date(d.date);
                        d.date_key = date.toISOString().split('T')[0];
                    }
                    if (d.is_outside === undefined) d.is_outside = false;
                });
            } catch (err) {
                const cached = localStorage.getItem('tripData_cache');
                if (cached) { try { tripData = JSON.parse(cached); } catch (e) {} }
            }
            localStorage.setItem('tripData_cache', JSON.stringify(tripData));
            overlay.classList.remove('active');
            return tripData;
        }

        // ================================================================
        //  保存
        // ================================================================
        async function saveToSupabase(day, field, value) {
            try {
                const checkRes = await fetch(`${SUPABASE_URL}trip_days?day=eq.${day}&select=id`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (!checkRes.ok) return false;
                const existing = await checkRes.json();
                if (existing.length === 0) {
                    const date = getDateFromDay(day);
                    const dateKey = date.toISOString().split('T')[0];
                    const insertRes = await fetch(`${SUPABASE_URL}trip_days`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            day: day,
                            date: dateKey,
                            date_key: dateKey,
                            city: `Day ${day}`,
                            country: '待定',
                            sights: '["待补充"]',
                            is_outside: false,
                            [field]: value
                        })
                    });
                    if (!insertRes.ok) return false;
                    let result = {};
                    try { const text = await insertRes.text(); if (text && text.trim()) result = JSON.parse(text); } catch (
                    e) {}
                    const idx = tripData.findIndex(d => d.day === day);
                    if (idx !== -1) tripData[idx] = { ...tripData[idx], ...result };
                    localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                    return true;
                }
                const id = existing[0].id;
                const updateRes = await fetch(`${SUPABASE_URL}trip_days?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json' },
                    body: JSON.stringify({ [field]: value })
                });
                if (!updateRes.ok) return false;
                let result = {};
                try { const text = await updateRes.text(); if (text && text.trim()) result = JSON.parse(text); } catch (e) {}
                const idx = tripData.findIndex(d => d.day === day);
                if (idx !== -1) tripData[idx] = { ...tripData[idx], ...result };
                localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                return true;
            } catch (err) {
                const idx = tripData.findIndex(d => d.day === day);
                if (idx !== -1) { tripData[idx][field] = value;
                    localStorage.setItem('tripData_cache', JSON.stringify(tripData)); }
                return false;
            }
        }

        async function saveOutsideTrip(dateKey, updates) {
            const existing = getTripByDateKey(dateKey);
            const payload = { ...updates, date_key: dateKey, date: dateKey };
            if (existing && existing.is_outside) {
                try {
                    const checkRes = await fetch(`${SUPABASE_URL}trip_days?date_key=eq.${dateKey}&select=id`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (!checkRes.ok) return false;
                    const records = await checkRes.json();
                    if (records.length === 0) return await createOutsideTrip(dateKey, payload);
                    const id = records[0].id;
                    const res = await fetch(`${SUPABASE_URL}trip_days?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) return false;
                    let result = {};
                    try { const text = await res.text(); if (text && text.trim()) result = JSON.parse(text); } catch (e) {}
                    const idx = tripData.findIndex(d => d.date_key === dateKey);
                    if (idx !== -1) tripData[idx] = { ...tripData[idx], ...result };
                    localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                    return true;
                } catch (err) { return false; }
            } else {
                return await createOutsideTrip(dateKey, payload);
            }
        }

        async function createOutsideTrip(dateKey, payload) {
            const newData = {
                day: 9999 + Math.floor(Math.random() * 10000),
                date: dateKey,
                date_key: dateKey,
                city: payload.city || '新行程',
                country: payload.country || '中国',
                sights: payload.sights || JSON.stringify(['待补充']),
                hotel_name: payload.hotel_name || '',
                hotel_note: payload.hotel_note || '',
                daily_note: payload.daily_note || '',
                ticket_price: payload.ticket_price || '',
                transport_note: payload.transport_note || '',
                image_urls: payload.image_urls || '[]',
                hotel_price: parseFloat(payload.hotel_price) || 0,
                transport_price: parseFloat(payload.transport_price) || 0,
                ticket_price_num: parseFloat(payload.ticket_price_num) || 0,
                food_price: parseFloat(payload.food_price) || 0,
                food_note: payload.food_note || '',
                other_price: parseFloat(payload.other_price) || 0,
                other_note: payload.other_note || '',
                is_outside: true
            };
            try {
                const res = await fetch(`${SUPABASE_URL}trip_days`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json' },
                    body: JSON.stringify(newData)
                });
                if (!res.ok) return false;
                let result = {};
                try { const text = await res.text(); if (text && text.trim()) result = JSON.parse(text); } catch (e) {}
                const savedData = { ...newData, ...result };
                const existingIdx = tripData.findIndex(d => d.date_key === dateKey);
                if (existingIdx !== -1) tripData[existingIdx] = savedData;
                else tripData.push(savedData);
                localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                return true;
            } catch (err) { return false; }
        }

        // ================================================================
        //  Cloudinary 上传
        // ================================================================
        function uploadToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => { if (data.secure_url) resolve(data.secure_url);
                        else reject(new Error('Cloudinary 错误')); })
                    .catch(err => reject(err));
            });
        }

        // ================================================================
        //  日历渲染
        // ================================================================
        function buildCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            weekdays.forEach(d => {
                const el = document.createElement('div');
                el.className = 'weekday';
                el.textContent = d;
                grid.appendChild(el);
            });

            const firstDay = new Date(currentYear, currentMonth, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = getDaysInMonth(currentYear, currentMonth);
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('monthTitle').textContent = `${currentYear}年${monthNames[currentMonth]}`;

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                const dayNum = getDayNumberForDate(currentYear, currentMonth, d);
                const inRange = isInTripRange(currentYear, currentMonth, d);
                const dateKey = getDateKey(currentYear, currentMonth, d);
                const inCalendar = isDateInCalendarRange(currentYear, currentMonth, d);

                cell.className = 'day-cell';
                if (!inCalendar) {
                    cell.classList.add('empty');
                    const dateEl = document.createElement('div');
                    dateEl.className = 'date';
                    dateEl.textContent = `${currentMonth+1}/${d}`;
                    cell.appendChild(dateEl);
                    grid.appendChild(cell);
                    continue;
                }

                const data = inRange ? getDayData(dayNum) : null;
                const outsideTrip = getTripByDateKey(dateKey);

                const dateEl = document.createElement('div');
                dateEl.className = 'date';
                dateEl.textContent = `${currentMonth+1}/${d}`;
                cell.appendChild(dateEl);

                if (inRange && dayNum !== null && data && data.city && data.city !== `Day ${dayNum}`) {
                    const dayLabel = document.createElement('div');
                    dayLabel.className = 'day-label';
                    dayLabel.textContent = `Day${data.day}`;
                    cell.appendChild(dayLabel);
                    const cityEl = document.createElement('div');
                    cityEl.className = 'city';
                    cityEl.textContent = data.city && data.city.length > 6 ? data.city.slice(0, 6) + '…' : (data.city ||
                    '');
                    cell.appendChild(cityEl);
                    const flagEl = document.createElement('div');
                    flagEl.className = 'flag';
                    flagEl.textContent = getCountryFlag(data.country) || '🌍';
                    cell.appendChild(flagEl);
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    const hasCost = (parseFloat(data.hotel_price) > 0) || (parseFloat(data.transport_price) > 0) ||
                        (parseFloat(data.ticket_price_num) > 0) || (parseFloat(data.food_price) > 0) ||
                        (parseFloat(data.other_price) > 0);
                    if (hasCost) dot.classList.add('has-cost-dot');
                    const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
                    const hasReminder = reminderKeywords.some(kw => (data.daily_note || '').includes(kw));
                    if (hasReminder) dot.classList.add('reminder-dot');
                    if (dayNum === getTodayDay()) dot.classList.add('today-dot');
                    cell.appendChild(dot);
                    let photoUrls = [];
                    try { photoUrls = JSON.parse(data.image_urls || '[]'); } catch (e) {}
                    if (photoUrls.length > 0) {
                        const photoInd = document.createElement('div');
                        photoInd.className = 'photo-indicator';
                        photoInd.textContent = `📷 ${photoUrls.length}`;
                        cell.appendChild(photoInd);
                    }
                    if (dayNum === getTodayDay()) cell.classList.add('today');
                    if (dayNum === currentDay) cell.classList.add('selected');
                    cell.dataset.day = dayNum;
                    cell.dataset.dateKey = dateKey;
                    cell.addEventListener('click', () => { jumpToDate(dateKey); });
                    cell.classList.add('has-trip');
                } else if (outsideTrip && outsideTrip.is_outside) {
                    const badge = document.createElement('div');
                    badge.className = 'outside-trip-badge';
                    badge.textContent = '📌';
                    cell.appendChild(badge);
                    const cityEl = document.createElement('div');
                    cityEl.className = 'city';
                    cityEl.textContent = outsideTrip.city && outsideTrip.city.length > 6 ? outsideTrip.city.slice(0, 6) +
                        '…' : (outsideTrip.city || '');
                    cell.appendChild(cityEl);
                    const flagEl = document.createElement('div');
                    flagEl.className = 'flag';
                    flagEl.textContent = getCountryFlag(outsideTrip.country) || '🌍';
                    cell.appendChild(flagEl);
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    const hasCost = (parseFloat(outsideTrip.hotel_price) > 0) || (parseFloat(outsideTrip.transport_price) >
                        0) ||
                        (parseFloat(outsideTrip.ticket_price_num) > 0) || (parseFloat(outsideTrip.food_price) > 0) ||
                        (parseFloat(outsideTrip.other_price) > 0);
                    if (hasCost) dot.classList.add('has-cost-dot');
                    cell.appendChild(dot);
                    cell.dataset.day = 'outside';
                    cell.dataset.dateKey = dateKey;
                    cell.addEventListener('click', () => { jumpToDate(dateKey); });
                    cell.classList.add('has-outside-trip');
                } else {
                    cell.classList.add('no-data');
                    const addHint = document.createElement('div');
                    addHint.className = 'add-hint';
                    addHint.textContent = '+ 添加';
                    cell.appendChild(addHint);
                    cell.dataset.day = 'outside';
                    cell.dataset.dateKey = dateKey;
                    cell.addEventListener('click', function() {
                        openOutsideTripModal(this.dataset.dateKey);
                    });
                }
                grid.appendChild(cell);
            }
        }

        function toggleMonthDropdown() {
            const dropdown = document.getElementById('monthDropdown');
            if (dropdown.style.display === 'block') { dropdown.style.display = 'none'; return; }
            dropdown.innerHTML = '';
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            monthNames.forEach((name, index) => {
                const opt = document.createElement('div');
                opt.className = 'month-option';
                if (index === currentMonth) opt.classList.add('active');
                opt.textContent = `${currentYear}年${name}`;
                opt.addEventListener('click', function() {
                    currentMonth = index;
                    buildCalendar();
                    dropdown.style.display = 'none';
                });
                dropdown.appendChild(opt);
            });
            const yearRow = document.createElement('div');
            yearRow.className = 'year-row';
            yearRow.innerHTML =
                `<button onclick="event.stopPropagation();changeYear(-1)">◀</button><span class="year-label">${currentYear}</span><button onclick="event.stopPropagation();changeYear(1)">▶</button>`;
            dropdown.appendChild(yearRow);
            dropdown.style.display = 'block';
        }

        function changeYear(delta) {
            currentYear += delta;
            if (currentYear < 2026) currentYear = 2026;
            if (currentYear > 2028) currentYear = 2028;
            buildCalendar();
            const dropdown = document.getElementById('monthDropdown');
            if (dropdown.style.display === 'block') toggleMonthDropdown();
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.month-select-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('monthDropdown').style.display = 'none';
            }
        });

        // ================================================================
        //  跳转
        // ================================================================
        function jumpToDay(day) {
            if (day === null || day === undefined || day < 1) day = 1;
            if (day > TOTAL_DAYS) day = TOTAL_DAYS;
            currentDay = day;
            const date = getDateFromDay(day);
            currentYear = date.getFullYear();
            currentMonth = date.getMonth();
            buildCalendar();
            const dateKey = date.toISOString().split('T')[0];
            showDayDetail(dateKey);
            document.getElementById('jumpInput').value = day;
            const cells = document.querySelectorAll('.day-cell');
            cells.forEach(cell => {
                cell.classList.remove('selected');
                if (cell.dataset.dateKey === dateKey) cell.classList.add('selected');
            });
            goToPage(2);
        }

        function jumpToDate(dateKey) {
            const parts = dateKey.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            currentYear = year;
            currentMonth = month;
            buildCalendar();
            const cells = document.querySelectorAll('.day-cell');
            cells.forEach(cell => {
                cell.classList.remove('selected');
                if (cell.dataset.dateKey === dateKey) cell.classList.add('selected');
            });
            showDayDetail(dateKey);
            goToPage(2);
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0;
                currentYear++; } else if (currentMonth < 0) { currentMonth = 11;
                currentYear--; }
            if (currentYear < 2026) { currentYear = 2026;
                currentMonth = 0; }
            if (currentYear > 2028) { currentYear = 2028;
                currentMonth = 11; }
            buildCalendar();
        }

        function goToTodayMonth() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            if (currentYear < 2026) { currentYear = 2026;
                currentMonth = 0; }
            if (currentYear > 2028) { currentYear = 2028;
                currentMonth = 11; }
            buildCalendar();
            const todayDay = getTodayDay();
            if (todayDay !== null && todayDay >= 1 && todayDay <= TOTAL_DAYS) {
                jumpToDay(todayDay);
            }
        }

        // ================================================================
        //  搜索
        // ================================================================
        function performSearch() {
            const input = document.getElementById('searchInput');
            const term = input.value.trim().toLowerCase();
            const dropdown = document.getElementById('searchResultsDropdown');
            const clearBtn = document.getElementById('clearSearchBtn');
            if (term.length < 1) { dropdown.classList.remove('active');
                clearBtn.classList.remove('visible'); return; }

            const results = [];
            tripData.forEach(d => {
                if (d.city === `Day ${d.day}` && !d.is_outside) return;
                let sightsArr = [];
                try { sightsArr = typeof d.sights === 'string' ? JSON.parse(d.sights) : (d.sights || []); } catch (e) {}
                const cityMatch = d.city && d.city.toLowerCase().includes(term);
                const countryMatch = d.country && d.country.toLowerCase().includes(term);
                const sightsMatch = sightsArr.some(s => s && s.toLowerCase().includes(term));
                const noteMatch = d.daily_note && d.daily_note.toLowerCase().includes(term);
                if (cityMatch || countryMatch || sightsMatch || noteMatch) {
                    results.push({ date_key: d.date_key, city: d.city, country: d.country, sights: sightsArr,
                        is_outside: d.is_outside, day: d.day });
                }
            });

            if (results.length === 0) {
                dropdown.innerHTML = `<div class="no-result">🔍 没有找到 "<strong>${term}</strong>"</div>`;
                dropdown.classList.add('active');
                clearBtn.classList.add('visible');
                return;
            }

            let html = '';
            results.forEach(r => {
                const label = r.is_outside ? '📌独立' : `Day${r.day}`;
                const sightsDisplay = r.sights.length > 0 ? r.sights.slice(0, 2).join(' · ') : '';
                html += `
                        <div class="result-item" onclick="jumpToDate('${r.date_key}')">
                            <span><span class="r-city">${r.city}</span> ${getCountryFlag(r.country)} ${sightsDisplay ? '· '+sightsDisplay : ''}</span>
                            <span class="r-date">${label}</span>
                        </div>
                    `;
            });
            dropdown.innerHTML = html;
            dropdown.classList.add('active');
            clearBtn.classList.add('visible');
        }

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault();
                performSearch(); }
        });
        let searchTimer = null;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimer);
            const term = this.value.trim();
            if (term.length < 1) {
                document.getElementById('searchResultsDropdown').classList.remove('active');
                document.getElementById('clearSearchBtn').classList.remove('visible');
                return;
            }
            searchTimer = setTimeout(performSearch, 300);
        });

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResultsDropdown').classList.remove('active');
            document.getElementById('clearSearchBtn').classList.remove('visible');
        }

        // ================================================================

        // ================================================================
        function setupCountrySearch() {
            const input = document.getElementById('countrySearchInput');
            const dropdown = document.getElementById('countryDropdown');
            const hidden = document.getElementById('tripCountry');
            input.addEventListener('input', function() {
                const term = this.value.trim().toLowerCase();
                if (term.length === 0) { dropdown.classList.remove('active'); return; }
                const matches = COUNTRIES.filter(c => c.name.includes(term) || c.name.toLowerCase().includes(term));
                dropdown.innerHTML = '';
                if (matches.length === 0) dropdown.innerHTML = '<div class="no-result">没有匹配的国家</div>';
                else {
                    matches.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'country-option';
                        div.innerHTML = `<span class="flag">${c.flag}</span><span class="name">${c.name}</span>`;
                        div.addEventListener('click', function() {
                            hidden.value = c.name;
                            input.value = c.name;
                            dropdown.classList.remove('active');
                        });
                        dropdown.appendChild(div);
                    });
                }
                dropdown.classList.add('active');
            });
            document.addEventListener('click', function(e) {
                if (!document.getElementById('countryWrapper').contains(e.target)) dropdown.classList.remove('active');
            });
            input.addEventListener('blur', function() {

        async function saveTrip() {
            const day = parseInt(document.getElementById('editDay').value) || null;
            const dateKey = document.getElementById('editDateKey').value;
            const isOutside = document.getElementById('editIsOutside').value === 'true';
            const dateStr = document.getElementById('tripDate').value;
            const city = document.getElementById('tripCity').value.trim() || '新行程';
            const country = document.getElementById('tripCountry').value || '中国';
            const sights = document.getElementById('tripSights').value.trim() || '待探索';
            const note = document.getElementById('tripNote').value.trim();
            const hotelPrice = parseFloat(document.getElementById('tripHotelPrice').value) || 0;
            const transportPrice = parseFloat(document.getElementById('tripTransportPrice').value) || 0;
            const ticketPrice = parseFloat(document.getElementById('tripTicketPrice').value) || 0;
            const foodPrice = parseFloat(document.getElementById('tripFoodPrice').value) || 0;
            const otherPrice = parseFloat(document.getElementById('tripOtherPrice').value) || 0;

            if (!dateStr) { alert('请选择日期'); return; }

            const updates = {
                city,
                country,
                sights: JSON.stringify(sights.split(',').map(s => s.trim())),
                daily_note: note,
                hotel_price: hotelPrice,
                transport_price: transportPrice,
                ticket_price_num: ticketPrice,
                food_price: foodPrice,
                other_price: otherPrice,
                image_urls: JSON.stringify(formPhotos),
                date_key: dateStr,
                date: dateStr
            };

            try {
                if (isOutside) {
                    const success = await saveOutsideTrip(dateStr, updates);
                    if (!success) { alert('保存失败'); return; }
                } else {
                    if (day && !isNaN(day) && day >= 1 && day <= TOTAL_DAYS) {
                        const fields = {
                            city,
                            country,
                            sights: JSON.stringify(sights.split(',').map(s => s.trim())),
                            daily_note: note,
                            hotel_price: hotelPrice,
                            transport_price: transportPrice,
                            ticket_price_num: ticketPrice,
                            food_price: foodPrice,
                            other_price: otherPrice,
                            image_urls: JSON.stringify(formPhotos)
                        };
                        for (const [field, value] of Object.entries(fields)) {
                            await saveToSupabase(day, field, value);
                        }
                    } else { alert('请选择有效的核心行程日期 (Day 1-70)'); return; }
                }
                closeTripModal();
                await refreshAll();
                jumpToDate(dateStr);
            } catch (err) {
                alert('保存失败: ' + err.message);
            }
        }

        async function removePhotoFromTrip(dateKey, index) {
            const data = getTripByDateKey(dateKey);
            if (!data) return;
            let photoUrls = [];
            try { photoUrls = JSON.parse(data.image_urls || '[]'); } catch (e) {}
            if (index >= 0 && index < photoUrls.length) {
                photoUrls.splice(index, 1);
                if (data.is_outside) await saveOutsideTrip(data.date_key, { image_urls: JSON.stringify(photoUrls) });
                else await saveToSupabase(data.day, 'image_urls', JSON.stringify(photoUrls));
                await refreshAll();
                jumpToDate(dateKey);
            }
        }

        // ================================================================
        //  删除行程
        // ================================================================
        async function deleteCurrentTrip() {
            const isOutside = editingIsOutside;
            const dateKey = editingDateKey;
            const day = editingDay;

            if (isOutside && dateKey) {
                if (!confirm(`确定删除 ${dateKey} 的独立行程吗？`)) return;
                try {
                    const queryRes = await fetch(`${SUPABASE_URL}trip_days?date_key=eq.${dateKey}&select=id`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (!queryRes.ok) throw new Error('查询失败');
                    const records = await queryRes.json();
                    if (records.length === 0) { tripData = tripData.filter(d => d.date_key !== dateKey);
                        localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                        await refreshAll();
                        goToPage(1); return; }
                    const targetId = records[0]?.id;
                    if (!targetId) { alert('找不到要删除的行程'); return; }
                    const res = await fetch(`${SUPABASE_URL}trip_days?id=eq.${targetId}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (!res.ok) throw new Error('删除失败');
                    tripData = tripData.filter(d => d.id !== targetId);
                    localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                    await refreshAll();
                    goToPage(1);
                    alert('✅ 已删除');
                } catch (err) { alert('删除失败: ' + err.message); }
            } else if (day) {
                if (!confirm(`确定重置 Day ${day} 的行程吗？`)) return;
                try {
                    const queryRes = await fetch(`${SUPABASE_URL}trip_days?day=eq.${day}&select=id`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (!queryRes.ok) throw new Error('查询失败');
                    const records = await queryRes.json();
                    if (records.length === 0) { tripData = tripData.filter(d => d.day !== day);
                        localStorage.setItem('tripData_cache', JSON.stringify(tripData));
                        await refreshAll();
                        goToPage(1); return; }
                    const targetId = records[0]?.id;
                    if (!targetId) { alert('找不到行程'); return; }
                    const res = await fetch(`${SUPABASE_URL}trip_days?id=eq.${targetId}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (!res.ok) throw new Error('删除失败');
                    const date = getDateFromDay(day);
                    const dateKey2 = date.toISOString().split('T')[0];
                    await fetch(`${SUPABASE_URL}trip_days`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            day,
                            date: dateKey2,
                            date_key: dateKey2,
                            city: `Day ${day}`,
                            country: '待定',
                            sights: '["待补充"]',
                            is_outside: false,
                            hotel_price: 0,
                            transport_price: 0,
                            ticket_price_num: 0,
                            food_price: 0,
                            other_price: 0,
                            image_urls: '[]',
                            daily_note: ''
                        })
                    });
                    await refreshAll();
                    goToPage(1);
                    alert('✅ 已重置');
                } catch (err) { alert('重置失败: ' + err.message); }
            } else { alert('没有找到要删除的行程'); }
        }

            if (existing) {

        async function deleteReminder(dateKey) {
            if (!confirm(`确定删除 ${dateKey} 的提醒吗？`)) return;
            const data = getTripByDateKey(dateKey);
            if (!data) return;
            const reminderKeywords = ['预约', '提醒', '预订', '买票', '购票', '订票', '购买'];
            let note = data.daily_note || '';
            reminderKeywords.forEach(kw => { note = note.replace(new RegExp(kw, 'g'), ''); });
            note = note.replace(/\s+/g, ' ').trim();
            if (data.is_outside) await saveOutsideTrip(dateKey, { daily_note: note });
            else await saveToSupabase(data.day, 'daily_note', note);
            await refreshAll();
            jumpToDate(dateKey);
            updateReminderPage();

        // ================================================================
        //  费用统计
        // ================================================================
        function getCosts(fromDate, toDate) {
            let hotelTotal = 0,
                transportTotal = 0,
                ticketTotal = 0,
                foodTotal = 0,
                otherTotal = 0;
            const filtered = tripData.filter(d => {
                if (!d.date) return true;
                if (fromDate && d.date < fromDate) return false;
                if (toDate && d.date > toDate) return false;
                if (d.city === `Day ${d.day}` && !d.is_outside) return false;
                return true;
            });
            filtered.forEach(d => {
                hotelTotal += parseFloat(d.hotel_price) || 0;
                transportTotal += parseFloat(d.transport_price) || 0;
                ticketTotal += parseFloat(d.ticket_price_num) || 0;
                foodTotal += parseFloat(d.food_price) || 0;
                otherTotal += parseFloat(d.other_price) || 0;
            });
            return { hotelTotal, transportTotal, ticketTotal, foodTotal, otherTotal, allTotal: hotelTotal + transportTotal +
                    ticketTotal + foodTotal + otherTotal };
        }

        function updateCostSummary() {
            const from = document.getElementById('filterDateFrom').value || null;
            const to = document.getElementById('filterDateTo').value || null;
            const costs = getCosts(from, to);
            document.getElementById('totalHotelCost').textContent = `¥${costs.hotelTotal.toFixed(0)}`;
            document.getElementById('totalTransportCost').textContent = `¥${costs.transportTotal.toFixed(0)}`;
            document.getElementById('totalTicketCost').textContent = `¥${costs.ticketTotal.toFixed(0)}`;
            document.getElementById('totalFoodCost').textContent = `¥${costs.foodTotal.toFixed(0)}`;
            document.getElementById('totalOtherCost').textContent = `¥${costs.otherTotal.toFixed(0)}`;
            document.getElementById('totalAllCost').textContent = `¥${costs.allTotal.toFixed(0)}`;
            document.getElementById('filterResult').textContent = from || to ? `📅 ${from||'开始'} ~ ${to||'结束'}` :
                '📊 显示全部';
            const count = tripData.filter(d => d.city !== `Day ${d.day}` || d.is_outside).length;
            document.getElementById('costTotalCount').textContent = `${count} 条记录`;
        }

            const reminders = tripData.filter(d => {
                const note = d.daily_note || '';
                return reminderKeywords.some(kw => note.includes(kw)) && d.city !== `Day ${d.day}`;
            });
            document.getElementById('reminderCount').textContent = `⏰ ${reminders.length} 提醒`;

            const countries = new Set(tripData.map(d => d.country).filter(c => c && c !== '待定' && c !== 'Day'));
            document.getElementById('totalCountriesDisplay').textContent = countries.size;

            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.page) === 1);
            });

            console.log('🗺️ 环球旅行日历 · 4页翻页版 + 汇率转换已修复');
        }

        init();
    </script>
</body>
</html>
